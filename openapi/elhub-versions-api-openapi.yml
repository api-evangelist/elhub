components:
  schemas:
    VirtualCalculationResponseAttributes:
      type: object
      title: VirtualCalculationResponseAttributes
      required:
      - udcId
      - name
      - managingParty
      - partyType
      properties:
        udcId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        managingParty:
          type: string
        partyType:
          type: string
    VersionGetResponse:
      type: object
      title: VersionGetResponse
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/VersionResourceData'
        included:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VersionIncluded'
        links:
          $ref: '#/components/schemas/JsonApiDocumentLinks'
    JsonApiToManyRelationship:
      type: object
      title: JsonApiToManyRelationship
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiResourceIdentifier'
    JsonApiDocumentLinks:
      type:
      - object
      - 'null'
      title: JsonApiDocumentLinks
      properties:
        self:
          type:
          - string
          - 'null'
        first:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
        next:
          type:
          - string
          - 'null'
        last:
          type:
          - string
          - 'null'
    OrganisationsResponseDto.Data.Attributes:
      type: object
      title: OrganisationsResponseDto.Data.Attributes
      required:
      - partyType
      - partyId
      - name
      - status
      properties:
        partyType:
          type: string
        partyId:
          type: string
        name:
          type: string
        status:
          type: string
    VersionIncluded.MeteringPointIncluded:
      type: object
      title: VersionIncluded.MeteringPointIncluded
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - MeteringPoint
        id:
          type: string
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonElement'
        relationships:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/JsonElement'
        links:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/JsonElement'
    VersionResourceData:
      type: object
      title: VersionResourceData
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: '#/components/schemas/VersionResponseAttributesDto'
        relationships:
          $ref: '#/components/schemas/VersionRelationships'
        links:
          $ref: '#/components/schemas/JsonApiResourceLink'
    JsonApiError:
      type: object
      title: JsonApiError
      properties:
        id:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        detail:
          type:
          - string
          - 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/JsonElement'
    JsonElement:
      type: object
      title: JsonElement
    JsonApiResourceIdentifier:
      type: object
      title: JsonApiResourceIdentifier
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
    VersionListResponse:
      type: object
      title: VersionListResponse
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionResourceData'
        included:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VersionIncluded'
        links:
          $ref: '#/components/schemas/JsonApiDocumentLinks'
    VersionIncluded.VcIncluded:
      type: object
      title: VersionIncluded.VcIncluded
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - VirtualCalculation
        id:
          type: string
        attributes:
          $ref: '#/components/schemas/VirtualCalculationResponseAttributes'
        relationships:
          $ref: '#/components/schemas/VirtualCalculationRelationships'
    VersionResponseAttributesDto:
      type: object
      title: VersionResponseAttributesDto
      required:
      - versionNumber
      - participants
      - status
      - template
      - settlementLevel
      - resolution
      - recipientFormulaType
      - contributorFormulaType
      - startDate
      properties:
        versionNumber:
          type: integer
        participants:
          type: array
          items:
            $ref: '#/components/schemas/VersionParticipantResponseDto'
        status:
          type: string
          enum:
          - Draft
          - Active
        template:
          type: string
          enum:
          - NetMetering
          - GrossMetering
          - NetConsLargeCustomer
          - SharedProduction
          - SharedConsumption
        settlementLevel:
          type: string
          enum:
          - Contributor
          - Totalizer
          - Participant
        resolution:
          type: string
          format: duration
        recipientFormulaType:
          type: string
          enum:
          - EquallyDistributed
          - ConsumptionBased
          - Manual
        contributorFormulaType:
          type: string
          enum:
          - EquallyDistributed
          - ProductionBased
          - Manual
          - NoDistribution
        startDate:
          type: string
          format: date
        endDate:
          type:
          - string
          - 'null'
          format: date
    JsonApiErrorDocument:
      type: object
      title: JsonApiErrorDocument
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiError'
    VirtualCalculationRelationships:
      type:
      - object
      - 'null'
      title: VirtualCalculationRelationships
      required:
      - party
      properties:
        party:
          $ref: '#/components/schemas/JsonApiToOneRelationship'
        versions:
          $ref: '#/components/schemas/JsonApiToManyRelationship'
    JsonApiResourceLink:
      type:
      - object
      - 'null'
      title: JsonApiResourceLink
      required:
      - self
      properties:
        self:
          type: string
    JsonApiToOneRelationship:
      type: object
      title: JsonApiToOneRelationship
      properties:
        data:
          $ref: '#/components/schemas/JsonApiResourceIdentifier'
    VersionRelationships:
      type:
      - object
      - 'null'
      title: VersionRelationships
      required:
      - virtualCalculation
      - meteringPoints
      properties:
        virtualCalculation:
          $ref: '#/components/schemas/JsonApiToOneRelationship'
        meteringPoints:
          $ref: '#/components/schemas/JsonApiToManyRelationship'
    VersionIncluded.OrgIncluded:
      type: object
      title: VersionIncluded.OrgIncluded
      required:
