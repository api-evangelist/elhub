                    data:
                    - type: SharedProduction
                      id: 9348adce-4574-4009-9af9-5b11ddc0259f
                      attributes:
                        versionNumber: 1
                        status: Active
                        template: SharedProduction
                        settlementLevel: Participant
                        resolution: PT60M
                        recipientFormulaType: EquallyDistributed
                        contributorFormulaType: Manual
                        startDate: '2025-01-01'
                        endDate: null
                        participants:
                        - meteringPointId: '707057500012345678'
                          role: Recipient
                          share: null
                        - meteringPointId: '707057500087654321'
                          role: Contributor
                          share: 0.5
                        - meteringPointId: '707057500011223344'
                          role: Contributor
                          share: 0.5
        '400':
          description: 'Invalid request: malformed query parameter or missing required headers.'
          content:
            application/vnd.api+json:
              schema:
