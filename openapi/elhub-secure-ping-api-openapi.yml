info:
  title: Elhub Secure ping API
  version: v0
  description: 'Operations tagged Secure ping across 2 of this provider''s published API definitions: elhub-data-export-api-openapi.yaml, elhub-energy-data-api-openapi.yaml. Each path carries the servers of the definition it was published in.'
tags:
- name: Secure ping
paths:
  /data-export/v0/secure-ping:
    get:
      tags:
      - Secure ping
      summary: Secure ping endpoint
      parameters:
      - name: Authorization
        in: header
        description: 'Include the bearer token obtained from Maskinporten in the Authorization header. Format: `Bearer <token>`.'
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: Bearer eyJhbGciOi...
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the onbehalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        '200':
          description: Successful ping response when the token is valid
          headers: {}
          content:
            application/json:
              schema:
                type: string
                title: String
              examples:
                pong:
                  summary: Pong response
                  value: '{"message": "Pong! Elhoo."}'
        '401':
          description: The request lacks valid authentication credentials
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                unauthorized:
                  value: '{"errors":[{"status":"401","title":"Unauthorized","detail":"creationTime: 2026-09-29T15:38:15+02:00","links":{"self":"https://api.elhub.no/energy-data/v0/secure-ping"}}]}'
        '403':
          description: Authenticated but not authorized to access the resource
