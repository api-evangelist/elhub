    controllable_unit_summary_response:
      summary: Response - Controllable Unit Summary
      description: Response schema - Aggregated summary of technical resources belonging to a controllable unit.
      type: object
      properties:
        id:
          description: Unique surrogate key (controllable unit ID).
          format: bigint
          type: integer
          readOnly: true
          example: 12
        controllable_unit_id:
          description: The ID of the controllable unit this resource is a summary of.
          format: bigint
          type: integer
          readOnly: true
          example: 12
        technical_resource:
          description: Aggregated statistics on technical resources belonging to the controllable unit, including counts and maximum active power breakdowns (sum, average, min, max) by category and technology.
          type: object
          readOnly: true
          properties:
            count:
              type: integer
            maximum_active_power:
              $ref: '#/components/schemas/numeric_aggregation'
            by_category:
              type: object
              propertyNames:
                $ref: '#/components/schemas/category'
              additionalProperties:
                type: object
                properties:
                  count:
                    type: integer
                  maximum_active_power:
                    $ref: '#/components/schemas/numeric_aggregation'
            by_technology:
              type: object
              propertyNames:
                $ref: '#/components/schemas/technology'
              additionalProperties:
                type: object
                properties:
                  count:
                    type: integer
                  maximum_active_power:
                    $ref: '#/components/schemas/numeric_aggregation'
          example:
            technical_resource:
              count: 3
              maximum_active_power:
                sum: 150
                average: 50
                min: 20
                max: 80
              by_category:
                production:
                  count: 2
                  maximum_active_power:
                    sum: 130
                    average: 65
                    min: 50
                    max: 80
                consumption:
                  count: 1
                  maximum_active_power:
                    sum: 20
                    average: 20
                    min: 20
                    max: 20
              by_technology:
                solar:
                  count: 2
                  maximum_active_power:
                    sum: 130
                    average: 65
                    min: 50
                    max: 80
                battery:
                  count: 1
                  maximum_active_power:
                    sum: 20
                    average: 20
                    min: 20
                    max: 20
        controllable_unit:
          description: Embedded controllable_unit
          oneOf:
          - $ref: '#/components/schemas/controllable_unit_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - controllable_unit_id
      - technical_resource
