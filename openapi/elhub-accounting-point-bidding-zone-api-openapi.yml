          description: Reference to the party assumed by the entity.
          format: bigint
          type: integer
          readOnly: true
          nullable: true
          example: 17
        party_name:
          description: Name of the party assumed by the entity.
          format: text
          type: string
          readOnly: true
          nullable: true
          example: Andersen SO
