          description: Technologies of the technical resource. Multiple technologies can be given, e.g. solar and battery for hybrid inverters.
          type: array
          items:
            $ref: '#/components/schemas/technology'
          minItems: 1
          example:
          - solar
          - battery
        category:
          description: Categories derived from the technologies of the technical resource. Automatically computed based on the selected technologies.
          type: array
          items:
            $ref: '#/components/schemas/category'
          readOnly: true
          example:
          - production
          - energy_storage
        maximum_active_power:
          description: Rated power in kilowatts. This is the maximum nominal continuous power of the device, typically defined by the manufacturer.
          format: decimal
          type: number
          minimum: 0
          maximum: 999999.999
          nullable: false
          multipleOf: 0.001
          example: 120.0
        device_type:
          description: The type of device.
          allOf:
          - $ref: '#/components/schemas/device_type'
          nullable: false
          example: inverter
