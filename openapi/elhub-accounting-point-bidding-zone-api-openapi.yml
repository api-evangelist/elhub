openapi: 3.2.0
info:
  title: Elhub Accounting Point Bidding Zone API
  version: '1.0'
  description: 'Operations tagged accounting_point_bidding_zone across 2 of this provider''s published API definitions: elhub-flex-information-system-main-api-openapi.json, elhub-postgrest-openapi-3-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test.flex.internal:6443/api/v1
  description: Development
- url: http://localhost:3000/
tags:
- name: accounting_point_bidding_zone
  description: Accounting Point Bidding Zone
paths:
  /accounting_point_bidding_zone:
    summary: Accounting Point Bidding Zone
    description: ''
    get:
      operationId: list_accounting_point_bidding_zone
      summary: List Accounting Point Bidding Zone
      tags:
      - accounting_point_bidding_zone
      parameters:
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: The ID of the accounting point.
        name: accounting_point_id
      - in: query
        name: valid_from
        schema:
          type: string
        example: eq.somevalid_from
        description: The date from which the accounting point belongs to the bidding zone. Midnight aligned on Norwegian timezone.
      - in: query
        name: valid_at
        schema:
          type: string
          format: date-time
        example: '2023-12-31T23:59:00+00:00'
        description: Filter based on valid time of the resource. Alternative to using valid_from and valid_to filters together.
      - in: query
        name: valid_to
        schema:
          type: string
        example: eq.somevalid_to
        description: The date until which the accounting point belongs to the bidding zone. Midnight aligned on Norwegian timezone.
      - description: Filtering Columns
        in: query
        name: select
        schema:
          type: string
      - description: Ordering
        in: query
        name: order
        schema:
          type: string
      - description: Limiting and Pagination
        in: query
        name: offset
        schema:
          type: string
      - description: Limiting and Pagination
        in: query
        name: limit
        schema:
          type: string
      - in: query
        name: embed
        schema:
          type: string
        description: Comma-separated list of related resources to embed in the response.
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/accounting_point_bidding_zone_response'
                type: array
          description: OK
        '206':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/accounting_point_bidding_zone_response'
                type: array
          description: Partial Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error_message'
                - $ref: '#/components/schemas/empty_object'
          description: Not Found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Not Acceptable
        '416':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Range Not Satisfiable
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Internal Server Error
      security:
      - bearerAuth:
        - read:data:accounting_point_bidding_zone
      - {}
    servers:
    - url: https://test.flex.internal:6443/api/v1
      description: Development
components:
  schemas:
    service_providing_group_product_application_status:
      description: The status of the application.
      format: text
      type: string
      default: requested
      enum:
      - requested
      - prequalification
      - temporary_qualified
      - prequalified
      - verified
      - rejected
      example: prequalification
    accounting_point_balance_responsible_party_response:
      summary: Response - Accounting Point Balance Responsible Party
      description: Response schema - Relation linking a balance responsible party to an accounting point.
      type: object
      properties:
        accounting_point_id:
          description: The ID of the accounting point.
          format: bigint
          type: integer
          readOnly: true
          example: 245
        balance_responsible_party_id:
          description: The balance responsible party of the accounting point.
          format: bigint
          type: integer
          example: 37
          readOnly: true
        energy_direction:
          $ref: '#/components/schemas/accounting_point_balance_responsible_party_energy_direction'
          readOnly: true
        valid_from:
          description: The date from which the relation between the accounting point and the balance responsible party is valid. Midnight aligned on Norwegian timezone.
          format: date-time
          type: string
          readOnly: true
          example: '2022-08-08T00:00:00+02'
        valid_to:
          description: The date until which the relation between the accounting point and the balance responsible party is valid. Midnight aligned on Norwegian timezone.
          format: date-time
          type: string
          readOnly: true
          nullable: true
        accounting_point:
          description: Embedded accounting_point
          oneOf:
          - $ref: '#/components/schemas/accounting_point_response'
          - type: 'null'
          nullable: true
        balance_responsible_party:
          description: Embedded party
          oneOf:
          - $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
      required:
      - accounting_point_id
      - balance_responsible_party_id
      - energy_direction
      - valid_from
    accounting_point_grid_location_response:
      summary: Response - Accounting Point Grid Location
      description: Response schema - The electrical (topological) location of an accounting point in the common grid model (Nemo).
      type: object
      properties:
        id:
          description: Unique surrogate key.
          format: bigint
          type: integer
          readOnly: true
          example: 1
        accounting_point_id:
          description: The accounting point this grid location belongs to.
          format: bigint
          type: integer
          example: 45
        object_type:
          $ref: '#/components/schemas/accounting_point_grid_location_object_type'
        business_id:
          description: Business identifier (mRID) referencing the object in the common grid model (NEMO).
          format: text
          type: string
          nullable: false
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          example: 53919b79-876f-4dad-8bde-b29368367604
        name:
          description: Name of the grid model object at the location.
          format: text
          type: string
          maxLength: 512
          example: Snilldal 1 KRA
        nominal_voltage:
          description: Nominal voltage level at the grid location, in kilovolt (kV).
          format: decimal
          type: number
          minimum: 0
          maximum: 999999.999
          multipleOf: 0.001
          example: 22
        additional_information:
          description: Free text field for extra information about the grid location if needed.
          format: text
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/accounting_point_grid_location_source'
          readOnly: true
        quality:
          $ref: '#/components/schemas/accounting_point_grid_location_quality'
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        accounting_point:
          description: Embedded accounting_point
          oneOf:
          - $ref: '#/components/schemas/accounting_point_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - accounting_point_id
      - object_type
      - business_id
      - name
      - nominal_voltage
      - source
      - quality
      - recorded_at
      - recorded_by
    service_providing_group_grid_suspension_response:
      summary: Response - Service Providing Group Grid Suspension
      description: Response schema - The relation allowing an impacted system operator to temporarily suspend a service providing group from delivering services.
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 49
        impacted_system_operator_id:
          description: Reference to the impacted system operator suspending the service providing group.
          format: bigint
          type: integer
          example: 7
        service_providing_group_id:
          description: Reference to the service providing group being suspended.
          format: bigint
          type: integer
          example: 13
        reason:
          $ref: '#/components/schemas/service_providing_group_grid_suspension_reason'
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        impacted_system_operator:
          description: Embedded party
          oneOf:
          - $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
        service_providing_group:
          description: Embedded service_providing_group
          oneOf:
          - $ref: '#/components/schemas/service_providing_group_response'
          - type: 'null'
          nullable: true
        comment:
          description: Embedded service_providing_group_grid_suspension_comment
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/service_providing_group_grid_suspension_comment_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - impacted_system_operator_id
      - service_providing_group_id
      - reason
      - recorded_at
      - recorded_by
    service_providing_group_grid_prequalification_response:
      summary: Response - Grid prequalification for service providing group
      description: Response schema - Grid prequalification for service providing group
      type: object
      properties:
        id:
          description: Unique surrogate key.
          format: bigint
          type: integer
          readOnly: true
          example: 27
        service_providing_group_id:
          description: Reference to the service providing group whose grid prequalification is tracked by the current resource.
          format: bigint
          type: integer
          example: 55
        impacted_system_operator_id:
          description: Reference to the `party` that is the impacted system operator.
          format: bigint
          type: integer
          example: 7
        status:
          $ref: '#/components/schemas/service_providing_group_grid_prequalification_status'
          default: requested
        prequalified_at:
          description: When the current grid prequalification was last approved.
          format: date-time
          type: string
          nullable: true
          example: '2023-01-08T10:00:00+01'
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        service_providing_group:
          description: Embedded service_providing_group
          oneOf:
          - $ref: '#/components/schemas/service_providing_group_response'
          - type: 'null'
          nullable: true
        impacted_system_operator:
          description: Embedded party
          oneOf:
          - $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
        comment:
          description: Embedded service_providing_group_grid_prequalification_comment
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/service_providing_group_grid_prequalification_comment_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - service_providing_group_id
      - impacted_system_operator_id
      - status
      - recorded_at
      - recorded_by
    controllable_unit_suspension_comment_visibility:
      description: The level of visibility of the comment.
      format: text
      type: string
      default: same_party
      enum:
      - same_party
      - any_involved_party
      example: same_party
    accounting_point_response:
      summary: Response - Accounting Point
      description: Response schema - Accounting point for a controllable unit.
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 89
        business_id:
          description: The GSRN metering point id of the accounting point.
          format: text
          type: string
          readOnly: true
          pattern: ^[1-9][0-9]{17}$
          example: '709000000000000057'
        system_operator_id:
          description: The system operator of the accounting point.
          format: bigint
          type: integer
          readOnly: true
        location:
          description: Geographic location of the accounting point (WGS84), as a GeoJSON point object.
          nullable: true
          readOnly: true
          example:
            type: Point
            coordinates:
            - -2.0259056
            - 48.6504504
          type: object
          oneOf:
          - $ref: '#/components/schemas/geojson_point'
          - type: 'null'
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        controllable_unit:
          description: Embedded controllable_unit
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/controllable_unit_response'
          - type: 'null'
          nullable: true
        system_operator:
          description: Embedded party
          oneOf:
          - $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
        balance_responsible_party:
          description: Embedded accounting_point_balance_responsible_party
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/accounting_point_balance_responsible_party_response'
          - type: 'null'
          nullable: true
        bidding_zone:
          description: Embedded accounting_point_bidding_zone
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/accounting_point_bidding_zone_response'
          - type: 'null'
          nullable: true
        end_user:
          description: Embedded accounting_point_end_user
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/accounting_point_end_user_response'
          - type: 'null'
          nullable: true
        energy_supplier:
          description: Embedded accounting_point_energy_supplier
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/accounting_point_energy_supplier_response'
          - type: 'null'
          nullable: true
        metering_grid_area:
          description: Embedded accounting_point_metering_grid_area
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/accounting_point_metering_grid_area_response'
          - type: 'null'
          nullable: true
        grid_location:
          description: Embedded accounting_point_grid_location
          oneOf:
          - $ref: '#/components/schemas/accounting_point_grid_location_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - business_id
      - system_operator_id
      - recorded_at
      - recorded_by
    service_providing_group_membership_response:
      summary: Response - Membership relation of controllable unit in service providing group
      description: Response schema - Membership relation of controllable unit in service providing group
      type: object
      properties:
        id:
          description: Unique surrogate key.
          format: bigint
          type: integer
          readOnly: true
          example: 27
        controllable_unit_id:
          description: Reference to the controllable unit this relation links to a service providing group.
          format: bigint
          type: integer
          example: 6
        service_providing_group_id:
          description: Reference to the service providing group this relation links to a controllable unit.
          format: bigint
          type: integer
          example: 55
        valid_from:
          description: The date from which the relation between the controllable unit and the service providing group is valid. Midnight aligned on Norwegian timezone.
          format: date-time
          type: string
          example: '2022-08-08T00:00:00+02'
        valid_to:
          description: The date until which the relation between the controllable unit and the service providing group is valid. Midnight aligned on Norwegian timezone.
          format: date-time
          type: string
          nullable: true
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        controllable_unit:
          description: Embedded controllable_unit
          oneOf:
          - $ref: '#/components/schemas/controllable_unit_response'
          - type: 'null'
          nullable: true
        service_providing_group:
          description: Embedded service_providing_group
          oneOf:
          - $ref: '#/components/schemas/service_providing_group_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - controllable_unit_id
      - service_providing_group_id
      - valid_from
      - recorded_at
      - recorded_by
    service_providing_group_summary_response:
      summary: Response - Service Providing Group Summary
      description: Response schema - Aggregated summary of controllable units and technical resources belonging to a service providing group.
      type: object
      properties:
        id:
          description: Unique surrogate key (service providing group ID).
          format: bigint
          type: integer
          readOnly: true
          example: 4
        service_providing_group_id:
          description: The ID of the service providing group this resource is a summary of.
          format: bigint
          type: integer
          readOnly: true
          example: 4
        controllable_unit:
          description: Aggregated statistics on controllable units currently in the service providing group, including count and maximum active power information (sum, average, min, max).
          type: object
          readOnly: true
          properties:
            count:
              type: integer
            maximum_active_power:
              $ref: '#/components/schemas/numeric_aggregation'
            maximum_active_power_up:
              description: Maximum active power aggregated over controllable units with regulation_direction equal to up or both.
              $ref: '#/components/schemas/numeric_aggregation'
            maximum_active_power_down:
              description: Maximum active power aggregated over controllable units with regulation_direction equal to down or both.
              $ref: '#/components/schemas/numeric_aggregation'
          example:
            count: 3
            maximum_active_power:
              sum: 200
              average: 66.67
              min: 40
              max: 100
            maximum_active_power_up:
              sum: 150
              average: 75
              min: 50
              max: 100
            maximum_active_power_down:
              sum: 100
              average: 50
              min: 40
              max: 60
        technical_resource:
          description: Aggregated statistics on technical resources belonging to controllable units with active membership in the service providing group, including counts and maximum active power breakdowns (sum, average, min, max) by category and technology.
          type: object
          readOnly: true
          properties:
            count:
              type: integer
            maximum_active_power:
              $ref: '#/components/schemas/numeric_aggregation'
            by_category:
              type: object
              propertyNames:
                $ref: '#/components/schemas/category'
              additionalProperties:
                type: object
                properties:
                  count:
                    type: integer
                  maximum_active_power:
                    $ref: '#/components/schemas/numeric_aggregation'
            by_technology:
              type: object
              propertyNames:
                $ref: '#/components/schemas/technology'
              additionalProperties:
                type: object
                properties:
                  count:
                    type: integer
                  maximum_active_power:
                    $ref: '#/components/schemas/numeric_aggregation'
          example:
            count: 8
            maximum_active_power:
              sum: 250
              average: 31.25
              min: 10
              max: 80
            by_category:
              production:
                count: 5
                maximum_active_power:
                  sum: 180
                  average: 36
                  min: 10
                  max: 80
              consumption:
                count: 3
                maximum_active_power:
                  sum: 70
                  average: 23.33
                  min: 15
                  max: 30
            by_technology:
              solar:
                count: 3
                maximum_active_power:
                  sum: 130
                  average: 43.33
                  min: 20
                  max: 80
              battery:
                count: 2
                maximum_active_power:
                  sum: 50
                  average: 25
                  min: 20
                  max: 30
        service_providing_group:
          description: Embedded service_providing_group
          oneOf:
          - $ref: '#/components/schemas/service_providing_group_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - service_providing_group_id
      - controllable_unit
      - technical_resource
    service_providing_group_status:
      description: The status of the group.
      format: text
      type: string
      default: new
      enum:
      - new
      - active
      - inactive
      - terminated
      example: active
    party_response:
      summary: Response - Party
      description: 'Response schema - The body that interacts with the Flexibility Information System


        A party is the thing that is authorized to access or modify data in the Flexiblity Information System.


        Example party types:


        * Service Provider

        * System Operator

        * End User'
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 11
        business_id:
          description: The business identifier of the party. Format depends on `business_id_type`.
          format: text
          type: string
          example: '1337099000000'
        business_id_type:
          $ref: '#/components/schemas/party_business_id_type'
          default: uuid
        entity_id:
          description: Reference to the entity that is the parent of the party.
          format: bigint
          type: integer
          example: 30
        name:
          description: Name of the party. Maximum 128 characters.
          format: text
          type: string
          example: Flex Energy Supplier
        role:
          $ref: '#/components/schemas/party_role'
        type:
          $ref: '#/components/schemas/party_type'
        status:
          $ref: '#/components/schemas/party_status'
          default: new
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        entity:
          description: Embedded entity
          oneOf:
          - $ref: '#/components/schemas/entity_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - business_id
      - business_id_type
      - entity_id
      - name
      - role
      - type
      - status
      - recorded_at
      - recorded_by
    entity_client_response:
      summary: Response - Entity client
      description: Response schema - Client linked to an entity for client credentials and JWT grant authentication methods.
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 14
        entity_id:
          description: Reference to the entity that this client is attached to.
          format: bigint
          type: integer
          example: 30
        name:
          description: Name of the client.
          format: text
          type: string
          maxLength: 256
          nullable: true
          example: Laptop
        client_id:
          description: The identifier of the entity. For use with client credentials authentication method.
          format: text
          type: string
          readOnly: true
          example: addr@flex.test
        party_id:
          description: Reference to the party this client allows to assume. A null value means the client cannot assume any party.
          format: bigint
          type: integer
          nullable: true
          example: 30
        scopes:
          description: 'List of scopes granted to the user when it logs in as an entity or when it acts as the party. When assuming a party through party membership, the least privileged set of scopes will be kept.

            Scopes are inspired from OAuth 2.0 and allow refinement of access control and privilege delegation mechanisms.'
          type: array
          items:
            $ref: '#/components/schemas/auth_scope'
          nullable: false
          example:
          - read:data
        client_secret:
          description: The secret of the entity. For use with client credentials authentication method. Input as plain text but stored encrypted.
          format: text
          type: string
          minLength: 12
          nullable: true
          example: mysupersecretpassword
        public_key:
          description: The public key of the entity (X.509 SubjectPublicKeyInfo). For use with JWT grant authentication method.
          format: text
          type: string
          nullable: true
