          description: The manufacturer of the device. Required if model or business id is provided.
          format: text
          type: string
          maxLength: 128
          nullable: true
          example: SolarEdge
        model:
          description: The model of the device.
          format: text
          type: string
          maxLength: 128
          nullable: true
          example: SE10K-RWS
        business_id:
          description: Business identifier of the device, such as a serial number or MAC address.
          format: text
          type: string
          maxLength: 256
          nullable: true
          example: SE10K123456789
        business_id_type:
          oneOf:
          - $ref: '#/components/schemas/technical_resource_business_id_type'
          - type: 'null'
          nullable: true
        additional_information:
          description: Free text field for extra information about the technical resource if needed.
          format: text
          type: string
          nullable: true
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        controllable_unit:
          description: Embedded controllable_unit
          oneOf:
          - $ref: '#/components/schemas/controllable_unit_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - name
