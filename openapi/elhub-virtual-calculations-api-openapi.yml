openapi: 3.2.0
info:
  title: Virtual Calculations API
  version: 1.0.0
  description: 'The Virtual Calculations API lets market participants manage shared-production

    virtual calculations on behalf of end customers, and read versions of virtual calculations

    of any template type.'
servers:
- url: https://api.elhub.no
  description: Server
tags:
- name: Virtual Calculations
paths:
  /settlement/v0/virtual-calculations/{udcId}:
    get:
      operationId: getVirtualCalculation
      tags:
      - Virtual Calculations
      summary: Get virtual calculation by id
      description: 'Retrieves a single virtual calculation by its UDC id. Use the `include` query

        parameter to side-load related `versions` and/or `party` resources.


        **Path:** `GET /settlement/v0/virtual-calculations/{udcId}`'
      parameters:
      - name: udcId
        in: path
        description: The UUID of the virtual calculation.
        required: true
        schema:
          type: string
        example: 9348adce-4574-4009-9af9-5b11ddc0259f
      - name: SenderGLN
        in: header
        description: GLN identifying the party making the request.
        required: true
        schema:
          type: string
        example: '7080000000001'
      - name: OnBehalfOfGLN
        in: header
        description: GLN of the grid owner the request is made on behalf of. Required when the token was issued with the `elhub:serviceprovider` scope, ignored otherwise.
        schema:
          type: string
        example: '7080000000002'
      - name: include
        in: query
        description: 'Comma-separated list of related resources to include. Supported values: `versions`, `party`.'
        schema:
          type: string
        example: versions,party
      responses:
        '200':
          description: A JSON:API document containing the requested virtual calculation, with optional included `versions` and/or `party` resources.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/VirtualCalculationGetResponse'
              examples:
                default:
                  summary: A single virtual calculation
                  value:
                    data:
                      type: VirtualCalculation
                      id: 9348adce-4574-4009-9af9-5b11ddc0259f
                      attributes:
                        udcId: 9348adce-4574-4009-9af9-5b11ddc0259f
                        name: Solpark Vest
                        description: Shared production for Solpark Vest residents
                        managingParty: '7080000000001'
                        partyType: GridOwner
        '400':
          description: 'Invalid request: malformed query parameter or missing required headers.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                MISSING_SENDER_GLN_HEADER:
                  summary: Required header 'SenderGLN' is missing.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '400'
                      code: MISSING_SENDER_GLN_HEADER
                      title: MISSING_SENDER_GLN_HEADER
                      detail: Required header 'SenderGLN' is missing.
                MISSING_ON_BEHALF_OF_GLN_HEADER:
                  summary: Required header 'OnBehalfOfGLN' is missing.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '400'
                      code: MISSING_ON_BEHALF_OF_GLN_HEADER
                      title: MISSING_ON_BEHALF_OF_GLN_HEADER
                      detail: Required header 'OnBehalfOfGLN' is missing.
                400 Bad Request:
                  summary: Did not understand the request
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '400'
                      code: 400 Bad Request
                      title: 400 Bad Request
                      detail: Did not understand the request
        '404':
          description: The requested virtual calculation was not found.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                VIRTUAL_CALCULATION_NOT_FOUND:
                  summary: Cannot find Virtual Calculation with id {udcId}
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '404'
                      code: VIRTUAL_CALCULATION_NOT_FOUND
                      title: VIRTUAL_CALCULATION_NOT_FOUND
                      detail: Cannot find Virtual Calculation with id {udcId}
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                Unauthorized:
                  summary: Authentication failed. The provided token may be expired, invalid, or missing.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '401'
                      code: Unauthorized
                      title: Unauthorized
                      detail: Authentication failed. The provided token may be expired, invalid, or missing.
                FAILED_AUTHORIZATION_EXCEPTION:
                  summary: Missing or invalid authentication credentials.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '401'
                      code: FAILED_AUTHORIZATION_EXCEPTION
                      title: FAILED_AUTHORIZATION_EXCEPTION
                      detail: Missing or invalid authentication credentials.
        '403':
          description: The token does not grant access to the requested resource (failed scope check or PDP denial).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                Forbidden:
                  summary: The authenticated caller does not have sufficient access to perform this action.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '403'
                      code: Forbidden
                      title: Forbidden
                      detail: The authenticated caller does not have sufficient access to perform this action.
                INVALID_TOKEN_SCOPE:
                  summary: The token scope is not authorized to perform this action.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '403'
                      code: INVALID_TOKEN_SCOPE
                      title: INVALID_TOKEN_SCOPE
                      detail: The token scope is not authorized to perform this action.
                INVALID_TOKEN_TYPE:
                  summary: The token type used is not authorized to perform this action.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '403'
                      code: INVALID_TOKEN_TYPE
                      title: INVALID_TOKEN_TYPE
                      detail: The token type used is not authorized to perform this action.
                UNVERIFIED_SENDER:
                  summary: The combination of token, 'SenderGLN' and/or 'OnBehalfOfGLN' does not identify a market party allowed to act.
                  value:
