                    - id: 00000000-0000-0000-0000-000000000000
                      status: '500'
                      code: 500 Internal Server Error
                      title: 500 Internal Server Error
                      detail: An unexpected error occurred while processing the request.
      security:
      - maskinporten: []
  /settlement/v0/virtual-calculations:
    post:
      operationId: createVirtualCalculation
      tags:
      - Virtual Calculations
      summary: Create a virtual calculation
      description: 'Creates a new virtual calculation owned by the calling party (`SenderGLN`).


        The request body `data.type` must be `VirtualCalculation`. The

        response is the created resource with HTTP 201 Created. **No version is created** —

        add versions via `POST /settlement/v0/virtual-calculations/{udcId}/versions`.


        **Path:** `POST /settlement/v0/virtual-calculations`'
      parameters:
      - name: SenderGLN
        in: header
        description: GLN identifying the party making the request.
        required: true
        schema:
          type: string
        example: '7080000000001'
      - name: OnBehalfOfGLN
        in: header
        description: GLN of the grid owner the request is made on behalf of. Required when the token was issued with the `elhub:serviceprovider` scope, ignored otherwise.
        schema:
          type: string
        example: '7080000000002'
      requestBody:
        description: 'A JSON:API document with the new virtual calculation attributes. Required: `name` (max 50 chars), `partyType`. Optional: `description` (max 100 chars).'
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/VirtualCalculationPostRequestDto'
            examples:
              default:
                summary: Create a virtual calculation
                value:
                  data:
                    type: VirtualCalculation
                    attributes:
                      name: Solpark Vest
                      description: Shared production for Solpark Vest residents
                      partyType: GridOwner
        required: true
      responses:
        '201':
          description: The newly created virtual calculation as a JSON:API document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/VirtualCalculationGetResponse'
              examples:
                default:
                  summary: A newly created virtual calculation
                  value:
                    data:
                      type: VirtualCalculation
                      id: 9348adce-4574-4009-9af9-5b11ddc0259f
                      attributes:
                        udcId: 9348adce-4574-4009-9af9-5b11ddc0259f
                        name: Solpark Vest
                        description: Shared production for Solpark Vest residents
                        managingParty: '7080000000001'
                        partyType: GridOwner
        '400':
          description: 'Invalid request: wrong JSON:API type, missing required headers, or malformed body.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
