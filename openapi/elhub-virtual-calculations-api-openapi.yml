    get:
      operationId: listVirtualCalculations
      tags:
      - Virtual Calculations
      summary: List virtual calculations
      description: 'Retrieves a paginated list of virtual calculations the calling party (`SenderGLN`) is

        authorized to read.


        Supports filtering by name, party id, version status, template type and metering point

        id. Supports pagination via `page[number]` and `page[size]`. Use the `include` query

        parameter to side-load related `versions` and/or `party` resources.


        **Path:** `GET /settlement/v0/virtual-calculations`'
      parameters:
      - name: SenderGLN
        in: header
        description: GLN identifying the party making the request.
        required: true
        schema:
          type: string
        example: '7080000000001'
      - name: OnBehalfOfGLN
        in: header
        description: GLN of the grid owner the request is made on behalf of. Required when the token was issued with the `elhub:serviceprovider` scope, ignored otherwise.
        schema:
          type: string
        example: '7080000000002'
      - name: filter[name]
        in: query
        description: Filter by virtual calculation name (supports multiple values).
        schema:
          type: string
        example: My Virtual Calculation
      - name: filter[party-id]
        in: query
        description: Filter by managing party id (supports multiple values).
        schema:
          type: string
        example: '3333000000082'
      - name: filter[version.status]
        in: query
        description: 'Filter by version status (supports multiple values): `Draft`, `Active`, `Inactive`, `Terminated`.'
        schema:
          type: string
        example: Active
      - name: filter[version.template-type]
        in: query
        description: 'Filter by version template type (supports multiple values): `NetMetering`, `GrossMetering`, `NetConsLargeCustomer`, `SharedProduction`, `SharedConsumption`.'
        schema:
          type: string
        example: SharedProduction
      - name: filter[version.metering-point-id]
        in: query
        description: Filter by metering point id participating in a version (supports multiple values).
        schema:
          type: string
        example: '571234567890123456'
      - name: filter[require-version]
        in: query
        description: If `true`, only return virtual calculations that have at least one version.
        schema:
          type: string
        example: 'false'
      - name: page[number]
        in: query
        description: Page number for pagination (1-based).
        schema:
          type: string
        example: '1'
      - name: page[size]
        in: query
        description: Number of items per page.
        schema:
          type: string
        example: '20'
      - name: include
        in: query
        description: 'Comma-separated list of related resources to include. Supported values: `versions`, `party`.'
        schema:
          type: string
        example: versions,party
      responses:
        '200':
          description: A JSON:API document containing the page of virtual calculations, with optional included `versions` and/or `party` resources, plus pagination links and meta.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/VirtualCalculationListResponse'
              examples:
                default:
                  summary: A page of virtual calculations
                  value:
                    data:
                    - type: VirtualCalculation
                      id: 9348adce-4574-4009-9af9-5b11ddc0259f
                      attributes:
                        udcId: 9348adce-4574-4009-9af9-5b11ddc0259f
                        name: Solpark Vest
                        description: Shared production for Solpark Vest residents
                        managingParty: '7080000000001'
                        partyType: GridOwner
                    links:
                      self: /settlement/v0/virtual-calculations?page[number]=1&page[size]=20
                      next: null
                      prev: null
                    meta:
                      page:
                        number: 1
                        size: 20
                        totalPages: 1
                        totalItems: 1
        '400':
          description: 'Invalid request: malformed query parameter or missing required headers.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                MISSING_SENDER_GLN_HEADER:
                  summary: Required header 'SenderGLN' is missing.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '400'
                      code: MISSING_SENDER_GLN_HEADER
                      title: MISSING_SENDER_GLN_HEADER
                      detail: Required header 'SenderGLN' is missing.
                MISSING_ON_BEHALF_OF_GLN_HEADER:
                  summary: Required header 'OnBehalfOfGLN' is missing.
                  value:
                    errors:
                    - id: 00000000-0000-0000-0000-000000000000
                      status: '400'
                      code: MISSING_ON_BEHALF_OF_GLN_HEADER
                      title: MISSING_ON_BEHALF_OF_GLN_HEADER
                      detail: Required header 'OnBehalfOfGLN' is missing.
                400 Bad Request:
                  summary: Did not understand the request
                  value:
