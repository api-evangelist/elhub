---
openapi: "3.1.1"
info:
  title: "Virtual Calculations API"
  version: "1.0.0"
  description: "The Virtual Calculations API lets market participants manage shared-production\n\
    virtual calculations on behalf of end customers, and read versions of virtual\
    \ calculations\nof any template type.\n\n## Supported Maskinporten scopes\n\n\
    | Scope | Acting party | Required headers |\n| --- | --- | --- |\n| `elhub:gridowner`\
    \ | The grid owner itself | `SenderGLN` |\n| `elhub:serviceprovider` | A grid\
    \ owner represented by a service provider | `SenderGLN`, `OnBehalfOfGLN` |\n\n\
    A grid owner calling the API directly provides its own GLN in `SenderGLN`. When\
    \ a service provider acts on behalf of a grid owner, `SenderGLN` contains\nthe\
    \ service provider's GLN, while `OnBehalfOfGLN` contains the grid owner's GLN.\
    \ The service provider must be registered in Elhub as authorized to act\nfor the\
    \ grid owner in `OnBehalfOfGLN`.\n\nFor full API documentation, see [Settlement\
    \ API](https://api.elhub.no/settlement-api)."
servers:
- url: "https://api.elhub.no"
  description: "Server"
paths:
  /settlement/v0/virtual-calculations/{udcId}/versions/{versionNumber}:
    get:
      operationId: "getVersionByUdcIdAndNumber"
      tags:
      - "Versions"
      summary: "Get a specific version of a virtual calculation"
      description: "Retrieves a single version identified by version number for a\
        \ virtual calculation\nidentified by UDC ID. Use the `include` query parameter\
        \ to side-load the parent\nVirtualCalculation, its managing party, and related\
        \ metering points\n(e.g. `include=virtual-calculation,virtual-calculation.party,virtual-calculation.meteringpoints`).\n\
        \n**Path:** `GET /settlement/v0/virtual-calculations/{udcId}/versions/{versionNumber}`"
      parameters:
      - name: "udcId"
        in: "path"
        description: "The UUID of the virtual calculation"
        required: true
        schema:
          type: "string"
        example: "9348adce-4574-4009-9af9-5b11ddc0259f"
      - name: "versionNumber"
        in: "path"
        description: "The version number to retrieve"
        required: true
        schema:
          type: "string"
        example: "1"
      - name: "SenderGLN"
        in: "header"
        description: "GLN identifying the party making the request."
        required: true
        schema:
          type: "string"
        example: "7080000000001"
      - name: "OnBehalfOfGLN"
        in: "header"
        description: "GLN of the grid owner the request is made on behalf of. Required\
          \ when the token was issued with the `elhub:serviceprovider` scope, ignored\
          \ otherwise."
        schema:
          type: "string"
        example: "7080000000002"
      - name: "include"
        in: "query"
        description: "Comma-separated list of related resources to include. Supported\
          \ values: `virtual-calculation`, `virtual-calculation.party`, `virtual-calculation.meteringpoints`,\
          \ `meteringpoints`."
        schema:
          type: "string"
        example: "virtual-calculation,virtual-calculation.party,meteringpoints"
      responses:
        "200":
          description: "A JSON:API document containing the requested version resource,\
            \ with optional included VirtualCalculation, party, and/or metering point\
            \ resources."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/VersionGetResponse"
              examples:
                default:
                  summary: "A single version"
                  value:
                    data:
                      type: "SharedProduction"
                      id: "9348adce-4574-4009-9af9-5b11ddc0259f"
                      attributes:
                        versionNumber: 1
                        status: "Active"
                        template: "SharedProduction"
                        settlementLevel: "Participant"
                        resolution: "PT60M"
                        recipientFormulaType: "EquallyDistributed"
                        contributorFormulaType: "Manual"
                        startDate: "2025-01-01"
                        endDate: null
                        participants:
                        - meteringPointId: "707057500012345678"
                          role: "Recipient"
                          share: null
                        - meteringPointId: "707057500087654321"
                          role: "Contributor"
                          share: 0.5
                        - meteringPointId: "707057500011223344"
                          role: "Contributor"
                          share: 0.5
        "400":
          description: "Invalid request: malformed query parameter or missing required\
            \ headers."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                MISSING_SENDER_GLN_HEADER:
                  summary: "Required header 'SenderGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_SENDER_GLN_HEADER"
                      title: "MISSING_SENDER_GLN_HEADER"
                      detail: "Required header 'SenderGLN' is missing."
                MISSING_ON_BEHALF_OF_GLN_HEADER:
                  summary: "Required header 'OnBehalfOfGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_ON_BEHALF_OF_GLN_HEADER"
                      title: "MISSING_ON_BEHALF_OF_GLN_HEADER"
                      detail: "Required header 'OnBehalfOfGLN' is missing."
                "400 Bad Request":
                  summary: "Did not understand the request"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "400 Bad Request"
                      title: "400 Bad Request"
                      detail: "Did not understand the request"
        "404":
          description: "The virtual calculation or requested version was not found."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                VIRTUAL_CALCULATION_NOT_FOUND:
                  summary: "Cannot find Virtual Calculation with id {udcId}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "404"
                      code: "VIRTUAL_CALCULATION_NOT_FOUND"
                      title: "VIRTUAL_CALCULATION_NOT_FOUND"
                      detail: "Cannot find Virtual Calculation with id {udcId}"
                VERSION_NOT_FOUND:
                  summary: "Version not found: vcUdcId={udcId}, version={versionNumber}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "404"
                      code: "VERSION_NOT_FOUND"
                      title: "VERSION_NOT_FOUND"
                      detail: "Version not found: vcUdcId={udcId}, version={versionNumber}"
        "502":
          description: "An upstream service (e.g. metering points service) returned\
            \ an error."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                METERING_POINTS_SERVICE_EXCEPTION:
                  summary: "An error occurred while trying to fetch the metering points"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "502"
                      code: "METERING_POINTS_SERVICE_EXCEPTION"
                      title: "METERING_POINTS_SERVICE_EXCEPTION"
                      detail: "An error occurred while trying to fetch the metering\
                        \ points"
        "401":
          description: "Missing or invalid authentication credentials."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                Unauthorized:
                  summary: "Authentication failed. The provided token may be expired,\
                    \ invalid, or missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "401"
                      code: "Unauthorized"
                      title: "Unauthorized"
                      detail: "Authentication failed. The provided token may be expired,\
                        \ invalid, or missing."
                FAILED_AUTHORIZATION_EXCEPTION:
                  summary: "Missing or invalid authentication credentials."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "401"
                      code: "FAILED_AUTHORIZATION_EXCEPTION"
                      title: "FAILED_AUTHORIZATION_EXCEPTION"
                      detail: "Missing or invalid authentication credentials."
        "403":
          description: "The token does not grant access to the requested resource\
            \ (failed scope check or PDP denial)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                Forbidden:
                  summary: "The authenticated caller does not have sufficient access\
                    \ to perform this action."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "403"
                      code: "Forbidden"
                      title: "Forbidden"
                      detail: "The authenticated caller does not have sufficient access\
                        \ to perform this action."
                INVALID_TOKEN_SCOPE:
                  summary: "The token scope is not authorized to perform this action."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "403"
                      code: "INVALID_TOKEN_SCOPE"
                      title: "INVALID_TOKEN_SCOPE"
                      detail: "The token scope is not authorized to perform this action."
                INVALID_TOKEN_TYPE:
                  summary: "The token type used is not authorized to perform this\
                    \ action."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "403"
                      code: "INVALID_TOKEN_TYPE"
                      title: "INVALID_TOKEN_TYPE"
                      detail: "The token type used is not authorized to perform this\
                        \ action."
                UNVERIFIED_SENDER:
                  summary: "The combination of token, 'SenderGLN' and/or 'OnBehalfOfGLN'\
                    \ does not identify a market party allowed to act."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "403"
                      code: "UNVERIFIED_SENDER"
                      title: "UNVERIFIED_SENDER"
                      detail: "The combination of token, 'SenderGLN' and/or 'OnBehalfOfGLN'\
                        \ does not identify a market party allowed to act."
                UNAUTHORIZED_METERING_POINTS:
                  summary: "The authenticated caller is not authorized to access one\
                    \ or more of the specified metering points."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "403"
                      code: "UNAUTHORIZED_METERING_POINTS"
                      title: "UNAUTHORIZED_METERING_POINTS"
                      detail: "The authenticated caller is not authorized to access\
                        \ one or more of the specified metering points."
        "429":
          description: "Per-client rate limit exceeded. Retry after the period indicated\
            \ by the `Retry-After` header."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                "429":
                  summary: "Too many requests. Wait for {retryAfter} seconds."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "429"
                      code: "429"
                      title: "Too Many Requests"
                      detail: "Too many requests. Wait for {retryAfter} seconds."
        "500":
          description: "An unexpected error occurred while processing the request."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                "500 Internal Server Error":
                  summary: "An unexpected error occurred while processing the request."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "500"
                      code: "500 Internal Server Error"
                      title: "500 Internal Server Error"
                      detail: "An unexpected error occurred while processing the request."
      security:
      - maskinporten: []
    patch:
      operationId: "updateSharedProductionVersion"
      tags:
      - "Shared Production"
      summary: "Update a shared production version"
      description: "Partially updates an existing shared production version identified\
        \ by UDC ID and\nversion number. Supports updating participants, status, template,\
        \ settlement level,\nresolution, formula types, and effective dates. Only\
        \ `Draft` versions can be updated.\nSetting `status` to `Active` will activate\
        \ the version (runs full activation\nvalidation). An empty PATCH body is rejected.\n\
        \n**Path:** `PATCH /settlement/v0/virtual-calculations/{udcId}/versions/{versionNumber}`"
      parameters:
      - name: "udcId"
        in: "path"
        description: "The UUID of the virtual calculation owning this version"
        required: true
        schema:
          type: "string"
        example: "9348adce-4574-4009-9af9-5b11ddc0259f"
      - name: "versionNumber"
        in: "path"
        description: "The version number to update"
        required: true
        schema:
          type: "string"
        example: "1"
      - name: "SenderGLN"
        in: "header"
        description: "GLN identifying the party making the request."
        required: true
        schema:
          type: "string"
        example: "7080000000001"
      - name: "OnBehalfOfGLN"
        in: "header"
        description: "GLN of the grid owner the request is made on behalf of. Required\
          \ when the token was issued with the `elhub:serviceprovider` scope, ignored\
          \ otherwise."
        schema:
          type: "string"
        example: "7080000000002"
      requestBody:
        description: "A JSON:API document with a partial set of version attributes\
          \ to update. The `data.type` must be `SharedProduction`. At least one attribute\
          \ must be provided. Supported attributes: participants, status, template,\
          \ settlementLevel, resolution, recipientFormulaType, contributorFormulaType,\
          \ startDate, endDate."
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/SharedProductionVersionPatchRequestDto"
            examples:
              activate:
                summary: "Activate a draft version"
                value:
                  data:
                    type: "SharedProduction"
                    id: "9348adce-4574-4009-9af9-5b11ddc0259f"
                    attributes:
                      status: "Active"
        required: true
      responses:
        "200":
          description: "The updated shared production version as a JSON:API document."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SharedProductionVersionResponseDto"
              examples:
                default:
                  summary: "An updated shared production version"
                  value:
                    data:
                      type: "SharedProduction"
                      id: "9348adce-4574-4009-9af9-5b11ddc0259f"
                      attributes:
                        versionNumber: 1
                        status: "Active"
                        template: "SharedProduction"
                        settlementLevel: "Participant"
                        resolution: "PT60M"
                        recipientFormulaType: "EquallyDistributed"
                        contributorFormulaType: "Manual"
                        startDate: "2025-01-01"
                        endDate: null
                        participants:
                        - meteringPointId: "707057500012345678"
                          role: "Recipient"
                          share: null
                        - meteringPointId: "707057500087654321"
                          role: "Contributor"
                          share: 0.5
                        - meteringPointId: "707057500011223344"
                          role: "Contributor"
                          share: 0.5
        "400":
          description: "Invalid request: wrong JSON:API type, malformed body, or validation\
            \ failure."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                MISSING_SENDER_GLN_HEADER:
                  summary: "Required header 'SenderGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_SENDER_GLN_HEADER"
                      title: "MISSING_SENDER_GLN_HEADER"
                      detail: "Required header 'SenderGLN' is missing."
                MISSING_ON_BEHALF_OF_GLN_HEADER:
                  summary: "Required header 'OnBehalfOfGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_ON_BEHALF_OF_GLN_HEADER"
                      title: "MISSING_ON_BEHALF_OF_GLN_HEADER"
                      detail: "Required header 'OnBehalfOfGLN' is missing."
                IDENTIFIER_MISMATCH:
                  summary: "UDC ID ({udcId}) does not match id in request body ({bodyId})"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "IDENTIFIER_MISMATCH"
                      title: "IDENTIFIER_MISMATCH"
                      detail: "UDC ID ({udcId}) does not match id in request body\
                        \ ({bodyId})"
                INVALID_DATA_TYPE:
                  summary: "Invalid type: {type}, expected: {expectedType}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "INVALID_DATA_TYPE"
                      title: "INVALID_DATA_TYPE"
                      detail: "Invalid type: {type}, expected: {expectedType}"
                EMPTY_UPDATE_REQUEST:
                  summary: "Received empty PATCH request for virtual calculation:\
                    \ {udcId} version: {versionNumber}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "EMPTY_UPDATE_REQUEST"
                      title: "EMPTY_UPDATE_REQUEST"
                      detail: "Received empty PATCH request for virtual calculation:\
                        \ {udcId} version: {versionNumber}"
                VERSION_UPDATE_FAILED:
                  summary: "Cannot update a version that already has an end date."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "VERSION_UPDATE_FAILED"
                      title: "VERSION_UPDATE_FAILED"
                      detail: "Cannot update a version that already has an end date."
                DESERIALIZATION_ERROR:
                  summary: "The request body could not be deserialized."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "DESERIALIZATION_ERROR"
                      title: "DeserializationError"
                      detail: "The request body could not be deserialized."
                TEMPLATE_TYPE_EXCEPTION:
                  summary: "Invalid template type: {type}, expected: SharedProduction"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "TEMPLATE_TYPE_EXCEPTION"
                      title: "TEMPLATE_TYPE_EXCEPTION"
                      detail: "Invalid template type: {type}, expected: SharedProduction"
                SETTLEMENT_LEVEL_EXCEPTION:
                  summary: "Invalid settlement level: {level}, expected: Participant"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "SETTLEMENT_LEVEL_EXCEPTION"
                      title: "SETTLEMENT_LEVEL_EXCEPTION"
                      detail: "Invalid settlement level: {level}, expected: Participant"
                TOO_MANY_PARTICIPANTS_EXCEPTION:
                  summary: "The number of participants exceeds the limit of {max}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "TOO_MANY_PARTICIPANTS_EXCEPTION"
                      title: "TOO_MANY_PARTICIPANTS_EXCEPTION"
                      detail: "The number of participants exceeds the limit of {max}"
                NEGATIVE_SHARE_EXCEPTION:
                  summary: "Participant shares must be non-negative."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "NEGATIVE_SHARE_EXCEPTION"
                      title: "NEGATIVE_SHARE_EXCEPTION"
                      detail: "Participant shares must be non-negative."
                SHARE_NOT_DEFINED_EXCEPTION:
                  summary: "All recipients must have a share defined for MANUAL formula\
                    \ type."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "SHARE_NOT_DEFINED_EXCEPTION"
                      title: "SHARE_NOT_DEFINED_EXCEPTION"
                      detail: "All recipients must have a share defined for MANUAL\
                        \ formula type."
                SUM_OF_SHARE_NOT_ONE_EXCEPTION:
                  summary: "The sum of {role} shares for MANUAL {role} formula type\
                    \ must equal 1 but was {sum}."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "SUM_OF_SHARE_NOT_ONE_EXCEPTION"
                      title: "SUM_OF_SHARE_NOT_ONE_EXCEPTION"
                      detail: "The sum of {role} shares for MANUAL {role} formula\
                        \ type must equal 1 but was {sum}."
                SHARE_DEFINED_EXCEPTION:
                  summary: "Recipients must not have a share defined for CONSUMPTION_BASED\
                    \ or EQUALLY_DISTRIBUTED formula types."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "SHARE_DEFINED_EXCEPTION"
                      title: "SHARE_DEFINED_EXCEPTION"
                      detail: "Recipients must not have a share defined for CONSUMPTION_BASED\
                        \ or EQUALLY_DISTRIBUTED formula types."
                MISSING_MANDATORY_ROLE_EXCEPTION:
                  summary: "At least one participant must have role {role}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_MANDATORY_ROLE_EXCEPTION"
                      title: "MISSING_MANDATORY_ROLE_EXCEPTION"
                      detail: "At least one participant must have role {role}"
                DUPLICATE_VERSION_EXCEPTION:
                  summary: "The updated version is identical to the current active\
                    \ version."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "DUPLICATE_VERSION_EXCEPTION"
                      title: "DUPLICATE_VERSION_EXCEPTION"
                      detail: "The updated version is identical to the current active\
                        \ version."
                PARTICIPANT_UPDATE_EXCEPTION:
                  summary: "When updating participants recipientFormulaType, contributorFormulaType\
                    \ and startDate must be provided."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "PARTICIPANT_UPDATE_EXCEPTION"
                      title: "PARTICIPANT_UPDATE_EXCEPTION"
                      detail: "When updating participants recipientFormulaType, contributorFormulaType\
                        \ and startDate must be provided."
                INVALID_END_DATE_EXCEPTION:
                  summary: "End date ({endDate}) must be on or after start date ({startDate})"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "INVALID_END_DATE_EXCEPTION"
                      title: "INVALID_END_DATE_EXCEPTION"
                      detail: "End date ({endDate}) must be on or after start date\
                        \ ({startDate})"
                INVALID_START_DATE_EXCEPTION:
                  summary: "Cannot activate version with start date in the past: ({startDate})"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "INVALID_START_DATE_EXCEPTION"
                      title: "INVALID_START_DATE_EXCEPTION"
                      detail: "Cannot activate version with start date in the past:\
                        \ ({startDate})"
                ROLE_IN_SHARED_PRODUCTION_EXCEPTION:
                  summary: "Role Totalizer is not allowed in Shared Production for\
                    \ metering point: {meteringPointId}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "ROLE_IN_SHARED_PRODUCTION_EXCEPTION"
                      title: "ROLE_IN_SHARED_PRODUCTION_EXCEPTION"
                      detail: "Role Totalizer is not allowed in Shared Production\
                        \ for metering point: {meteringPointId}"
                      meta:
                        InvalidParticipants:
                        - "707057500012345678"
                DUPLICATE_PARTICIPANTS_EXCEPTION:
                  summary: "Duplicate metering point IDs found: [{meteringPointIds}]"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "DUPLICATE_PARTICIPANTS_EXCEPTION"
                      title: "DUPLICATE_PARTICIPANTS_EXCEPTION"
                      detail: "Duplicate metering point IDs found: [{meteringPointIds}]"
                      meta:
                        InvalidParticipants:
                        - "707057500012345678"
        "415":
          description: "Unsupported request content type. Only JSON:API request bodies\
            \ are accepted."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                UNSUPPORTED_MEDIA_TYPE:
                  summary: "The request content type must be application/vnd.api+json."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "415"
                      code: "UNSUPPORTED_MEDIA_TYPE"
                      title: "UNSUPPORTED_MEDIA_TYPE"
                      detail: "The request content type must be application/vnd.api+json."
        "404":
          description: "The requested version was not found, or the virtual calculation\
            \ is not managed by the caller."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                VERSION_NOT_FOUND:
                  summary: "Version not found: vcUdcId={udcId}, version={versionNumber}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "404"
                      code: "VERSION_NOT_FOUND"
                      title: "VERSION_NOT_FOUND"
                      detail: "Version not found: vcUdcId={udcId}, version={versionNumber}"
                VIRTUAL_CALCULATION_NOT_FOUND:
                  summary: "Cannot find Virtual Calculation with id {udcId}"
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "404"
                      code: "VIRTUAL_CALCULATION_NOT_FOUND"
                      title: "VIRTUAL_CALCULATION_NOT_FOUND"
                      detail: "Cannot find Virtual Calculation with id {udcId}"
        "409":
          description: "A conflicting EIP process is in progress for this virtual\
            \ calculation."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
