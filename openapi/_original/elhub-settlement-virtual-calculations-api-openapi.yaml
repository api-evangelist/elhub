  /settlement/v0/virtual-calculations/events:
    get:
      operationId: "subscribeToResourceChanges"
      tags:
      - "Events"
      summary: "Subscribe to resource change events"
      description: "Opens a Server-Sent Events (SSE) stream that emits thin notifications\
        \ whenever a virtual calculation resource changes.\nEach event contains an\
        \ SSE `id`, the SSE `event` is an enum  (either `resource.created` or\n`resource.updated`,\
        \ and a JSON payload in the SSE `data` field using JSON:API document members\n\
        (`data` and optional `meta`) describing which resource changed.\nClients are\
        \ expected to follow up with a GET request to the referenced `links` to retrieve\
        \ the latest state.\n\nThe stream starts with an SSE `retry` directive of\
        \ 3000 milliseconds so compliant\nclients know how long to wait before reconnecting\
        \ after a disconnect. Clients that\nreconnect can provide the `Last-Event-ID`\
        \ header to replay any events that were\npersisted after the last processed\
        \ event.\n\n**Path:** `GET /settlement/v0/virtual-calculations/events`"
      parameters:
      - name: "SenderGLN"
        in: "header"
        description: "GLN identifying the party making the request."
        required: true
        schema:
          type: "string"
        example: "7080000000001"
      - name: "OnBehalfOfGLN"
        in: "header"
        description: "GLN of the grid owner the request is made on behalf of. Required\
          \ when the token was issued with the `elhub:serviceprovider` scope, ignored\
          \ otherwise."
        schema:
          type: "string"
        example: "7080000000002"
      - name: "Last-Event-ID"
        in: "header"
        description: "Optional SSE replay cursor. When provided with a previously\
          \ observed event id, the stream resolves that event to its occurredAt/persistedAt\
          \ position and replays newer persisted events before continuing with live\
          \ events."
        schema:
          type: "string"
        example: "42"
      responses:
        "200":
          description: "A `text/event-stream` response where each SSE event contains\
            \ either the `resource.created` or `resource.updated` event type, and\
            \ a JSON payload in the SSE `data` field with a JSON:API-style resource\
            \ reference. The OpenAPI schema describes the full SSE frame as a string;\
            \ the JSON in each `data:` line follows `ResourceChangeEventDto`."
          content:
            text/event-stream:
              schema:
                type: "string"
              examples:
                resourceUpdatedFrame:
                  summary: "Single SSE event frame"
                  value: "id: 42\nevent: resource.updated\ndata: {\"data\":{\"type\"\
                    :\"VirtualCalculation\",\"id\":\"11111111-1111-1111-1111-111111111111\"\
                    ,\"links\":{\"self\":\"/settlement/v0/virtual-calculations/11111111-1111-1111-1111-111111111111\"\
                    }},\"meta\":{\"occurredAt\":\"2026-05-26T10:31:12.123Z\"}}\n\n"
        "400":
          description: "Invalid request: missing required headers, or an invalid `Last-Event-ID`\
            \ header value (for example non-numeric)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                MISSING_SENDER_GLN_HEADER:
                  summary: "Required header 'SenderGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_SENDER_GLN_HEADER"
