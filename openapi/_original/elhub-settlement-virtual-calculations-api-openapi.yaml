      tags:
      - "Virtual Calculations"
      summary: "List virtual calculations"
      description: "Retrieves a paginated list of virtual calculations the calling\
        \ party (`SenderGLN`) is\nauthorized to read.\n\nSupports filtering by name,\
        \ party id, version status, template type and metering point\nid. Supports\
        \ pagination via `page[number]` and `page[size]`. Use the `include` query\n\
        parameter to side-load related `versions` and/or `party` resources.\n\n**Path:**\
        \ `GET /settlement/v0/virtual-calculations`"
      parameters:
      - name: "SenderGLN"
        in: "header"
        description: "GLN identifying the party making the request."
        required: true
        schema:
          type: "string"
        example: "7080000000001"
      - name: "OnBehalfOfGLN"
        in: "header"
        description: "GLN of the grid owner the request is made on behalf of. Required\
          \ when the token was issued with the `elhub:serviceprovider` scope, ignored\
          \ otherwise."
        schema:
          type: "string"
        example: "7080000000002"
      - name: "filter[name]"
        in: "query"
        description: "Filter by virtual calculation name (supports multiple values)."
        schema:
          type: "string"
        example: "My Virtual Calculation"
      - name: "filter[party-id]"
        in: "query"
        description: "Filter by managing party id (supports multiple values)."
        schema:
          type: "string"
        example: "3333000000082"
      - name: "filter[version.status]"
        in: "query"
        description: "Filter by version status (supports multiple values): `Draft`,\
          \ `Active`, `Inactive`, `Terminated`."
        schema:
          type: "string"
        example: "Active"
      - name: "filter[version.template-type]"
        in: "query"
        description: "Filter by version template type (supports multiple values):\
          \ `NetMetering`, `GrossMetering`, `NetConsLargeCustomer`, `SharedProduction`,\
          \ `SharedConsumption`."
        schema:
          type: "string"
        example: "SharedProduction"
      - name: "filter[version.metering-point-id]"
        in: "query"
        description: "Filter by metering point id participating in a version (supports\
          \ multiple values)."
        schema:
          type: "string"
        example: "571234567890123456"
      - name: "filter[require-version]"
        in: "query"
        description: "If `true`, only return virtual calculations that have at least\
          \ one version."
        schema:
          type: "string"
        example: "false"
      - name: "page[number]"
        in: "query"
        description: "Page number for pagination (1-based)."
        schema:
          type: "string"
        example: "1"
      - name: "page[size]"
        in: "query"
        description: "Number of items per page."
