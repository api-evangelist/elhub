  /settlement/v0/virtual-calculations/{udcId}/versions:
    post:
      operationId: "createSharedProductionVersion"
      tags:
      - "Shared Production"
      summary: "Create a new shared production version"
      description: "Creates a new version for an existing virtual calculation identified\
        \ by UDC ID.\nThe request body must contain participants, template, settlement\
        \ level, resolution,\nformula types, and effective dates. The request body\
        \ `data.id` must match the UDC\nID path parameter and `data.type` must be\
        \ `SharedProduction`.\n\nThe optional `status` field controls activation:\
        \ omitting it or setting it to\n`Draft` creates a Draft version; setting it\
        \ to `Active` creates the version and\nimmediately activates it (runs full\
        \ activation validation).\n\n**Path:** `POST /settlement/v0/virtual-calculations/{udcId}/versions`"
      parameters:
      - name: "udcId"
        in: "path"
        description: "The UUID of the virtual calculation to add a version to"
        required: true
        schema:
          type: "string"
        example: "9348adce-4574-4009-9af9-5b11ddc0259f"
      - name: "SenderGLN"
        in: "header"
        description: "GLN identifying the party making the request."
        required: true
        schema:
          type: "string"
        example: "7080000000001"
      - name: "OnBehalfOfGLN"
        in: "header"
        description: "GLN of the grid owner the request is made on behalf of. Required\
          \ when the token was issued with the `elhub:serviceprovider` scope, ignored\
          \ otherwise."
        schema:
          type: "string"
        example: "7080000000002"
      requestBody:
        description: "A JSON:API document containing the new version data. The `data.id`\
          \ must match the udcId path parameter and `data.type` must be `SharedProduction`.\
          \ Required attributes: `participants` (list with `meteringPointId`, `role`,\
          \ `share`), `template`, `settlementLevel`, `resolution` (ISO 8601 duration),\
          \ `recipientFormulaType`, `contributorFormulaType`, `startDate`. Optional:\
          \ `endDate`, `status` (`Draft` or `Active`; defaults to `Draft`)."
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/SharedProductionVersionPostRequestDto"
            examples:
              draft:
                summary: "Create a draft with equal distribution (no share needed)"
                value:
                  data:
                    type: "SharedProduction"
                    id: "9348adce-4574-4009-9af9-5b11ddc0259f"
                    attributes:
                      participants:
                      - meteringPointId: "707057500012345678"
                        role: "Recipient"
                        share: null
                      - meteringPointId: "707057500087654321"
                        role: "Contributor"
                        share: null
                      template: "SharedProduction"
                      settlementLevel: "Participant"
                      resolution: "PT60M"
                      recipientFormulaType: "EquallyDistributed"
                      contributorFormulaType: "EquallyDistributed"
                      startDate: "2025-01-01"
                      endDate: null
                      status: "Draft"
              manual-distribution:
                summary: "Create with manual distribution for both recipients and\
                  \ contributors"
                value:
                  data:
                    type: "SharedProduction"
                    id: "a1b2c3d4-5678-90ab-cdef-1234567890ab"
                    attributes:
                      participants:
                      - meteringPointId: "707057500012345678"
                        role: "Recipient"
                        share: 0.6
                      - meteringPointId: "707057500055667788"
                        role: "Recipient"
                        share: 0.4
                      - meteringPointId: "707057500087654321"
                        role: "Contributor"
                        share: 0.5
                      - meteringPointId: "707057500011223344"
                        role: "Contributor"
                        share: 0.5
                      template: "SharedProduction"
                      settlementLevel: "Participant"
                      resolution: "PT60M"
                      recipientFormulaType: "Manual"
                      contributorFormulaType: "Manual"
                      startDate: "2025-01-01"
                      endDate: null
                      status: "Draft"
              active:
                summary: "Create a shared production and immediately activate it"
                value:
                  data:
                    type: "SharedProduction"
                    id: "b2c3d4e5-6789-01ab-cdef-234567890abc"
                    attributes:
                      participants:
                      - meteringPointId: "707057500012345678"
                        role: "Recipient"
                        share: null
                      - meteringPointId: "707057500087654321"
                        role: "Contributor"
                        share: null
                      template: "SharedProduction"
                      settlementLevel: "Participant"
                      resolution: "PT60M"
                      recipientFormulaType: "EquallyDistributed"
                      contributorFormulaType: "EquallyDistributed"
                      startDate: "2025-01-01"
                      endDate: null
                      status: "Active"
        required: true
      responses:
        "201":
          description: "The newly created shared production version as a JSON:API\
            \ document."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SharedProductionVersionResponseDto"
              examples:
                default:
                  summary: "A newly created shared production version"
                  value:
                    data:
                      type: "SharedProduction"
                      id: "9348adce-4574-4009-9af9-5b11ddc0259f"
                      attributes:
                        versionNumber: 1
                        status: "Active"
                        template: "SharedProduction"
                        settlementLevel: "Participant"
                        resolution: "PT60M"
                        recipientFormulaType: "EquallyDistributed"
                        contributorFormulaType: "Manual"
                        startDate: "2025-01-01"
                        endDate: null
                        participants:
                        - meteringPointId: "707057500012345678"
                          role: "Recipient"
                          share: null
                        - meteringPointId: "707057500087654321"
                          role: "Contributor"
                          share: 0.5
                        - meteringPointId: "707057500011223344"
                          role: "Contributor"
                          share: 0.5
        "400":
          description: "Invalid request: malformed body, validation failure, or authorization\
            \ error."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/JsonApiErrorDocument"
              examples:
                MISSING_SENDER_GLN_HEADER:
                  summary: "Required header 'SenderGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_SENDER_GLN_HEADER"
                      title: "MISSING_SENDER_GLN_HEADER"
                      detail: "Required header 'SenderGLN' is missing."
                MISSING_ON_BEHALF_OF_GLN_HEADER:
                  summary: "Required header 'OnBehalfOfGLN' is missing."
                  value:
                    errors:
                    - id: "00000000-0000-0000-0000-000000000000"
                      status: "400"
                      code: "MISSING_ON_BEHALF_OF_GLN_HEADER"
                      title: "MISSING_ON_BEHALF_OF_GLN_HEADER"
                      detail: "Required header 'OnBehalfOfGLN' is missing."
                IDENTIFIER_MISMATCH:
                  summary: "UDC ID ({udcId}) does not match id in request body ({bodyId})"
