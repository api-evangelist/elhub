  /contracts/summary:
    get:
      summary: A summary of contracts by type and state.
      operationId: summary
      description: |
        Retrieves an aggregated summary of contracts for the authenticated GLN, broken down by contract type
        (norgespris) and state (active, initiated, cancelled, expired)
        within the specified time range. Each contract type includes the most recent update timestamp.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/Sender"
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: filter[updatedAt][gt]
          in: query
          description: Filter contracts updated after this timestamp (RFC 3339 format in Oslo time - Europe/Oslo timezone)
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-06-01T10:07:33.968671+02:00"
        - name: filter[updatedAt][lt]
          in: query
          description: Filter contracts updated before this timestamp (RFC 3339 format in Oslo time - Europe/Oslo timezone)
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-06-01T10:07:33.968671+02:00"
        - name: filter[createdAt][gt]
          in: query
          description: Filter contracts created after this timestamp (RFC 3339 format in Oslo time - Europe/Oslo timezone)
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-06-01T10:07:33.968671+02:00"
        - name: filter[createdAt][lt]
          in: query
          description: Filter contracts created before this timestamp (RFC 3339 format in Oslo time - Europe/Oslo timezone)
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-06-01T10:07:33.968671+02:00"
        - name: filter[contractType]
          in: query
          description: Filter by contract type. This is used to retrieve all records of a specific type; e.g., all contracts of type Norgespris.
          required: false
          schema:
            type: string
            enum:
              - Norgespris
      responses:
        "200":
          description: Successful response with contract summary by type.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ContractSummaryResponse"
        "400":
          description: Bad Request - When the request is invalid
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  $ref: "#/components/examples/unauthorized"
        "403":
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internalError:
                  $ref: "#/components/examples/internalError"
  /contracts/ping:
    get:
      summary: A secured Health check endpoint
      description: Simple health secured check endpoint that returns "pong" to verify the service is running.
      operationId: ping
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: Service is healthy
          content:
            application/vnd.api+json:
              schema:
                type: string
                example: "pong"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  $ref: "#/components/examples/unauthorized"
  /contracts/open/ping:
    get:
      summary: Health check endpoint
      description: Simple health check endpoint that returns "pong" to verify the service is running.
      operationId: open-ping
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      security: [] # No authentication required for this endpoint
      responses:
        "200":
          description: Service is healthy
          content:
            application/vnd.api+json:
              schema:
                type: string
                example: "pong"
components:
  parameters:
    UserAgent:
      name: User-Agent
      in: header
      required: true
      description: Identifies the client software originating the request.
      schema:
        type: string
        example: ExampleCompany-ElhubClient/1.0.0
    Sender:
      name: Sender
      in: header
      description: Global Location Number (GLN) of the requesting party
      schema:
        type: string
        pattern: ^[0-9]{13}$
    OnBehalfOf:
      name: On-Behalf-Of
      in: header
      description: Global Location Number (GLN) of the party on whose behalf the request is made
      schema:
        type: string
        pattern: ^[0-9]{13}$
  schemas:
    ContractResponses:
      allOf:
        - $ref: "./schemas/contracts/norgespris/response/contracts-list.schema.json#/definitions/response"
    CreateContractRequests:
      allOf:
        - $ref: "./schemas/contracts/norgespris/request/contracts-list.schema.json#/definitions/createRequest"
    ContractSummaryResponse:
      allOf:
        - $ref: "./schemas/contracts/summary/contracts-summary.schema.json#/definitions/response"
    UpdateContractRequests:
      allOf:
        - $ref: "./schemas/contracts/norgespris/request/contracts-list.schema.json#/definitions/updateRequest"
    SingleUpdateContractRequest:
      allOf:
        - $ref: "./schemas/contracts/norgespris/request/contract-single.schema.json#/definitions/updateRequest"
    SingleContractResponse:
      allOf:
        - $ref: "./schemas/contracts/norgespris/response/contract-single.schema.json#/definitions/response"
    Error:
      allOf:
        - $ref: "./schemas/json-api-error.schema.json"
  examples:
    missingAttributes:
      summary: Missing Attributes in Contract Creation
      value:
        errors:
          - status: "400"
            code: INVALID_INPUT
            title: Missing Attributes in Contract Creation
            detail: No attributes have been detected.
            source:
              pointer: /data/attributes
    missingRelationships:
      summary: Missing Relationships in Contract Creation
      value:
        errors:
          - status: "400"
            code: INVALID_INPUT
            title: Missing Relationships in Contract Creation
            detail: Relationships can't be empty.
            source:
              pointer: /data/relationships
