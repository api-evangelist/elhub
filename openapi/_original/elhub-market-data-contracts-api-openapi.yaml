openapi: 3.1.1
info:
  title: Contracts JSON:API
  description: |
    API for managing contract information in the Elhub system.
    Contracts represent agreements on metering points in the Elhub system and is used to represent a variety of different relationships
    that can exist on a metering point. Norgespris is a type of contract in the Elhub information model.
  version: 0.0.1
  contact:
    name: team-wow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /market-data/v1
security:
  - bearerAuth: []
paths:
  /contracts:
    get:
      summary: Get all contracts
      description: |
        Get all contracts which you (as a market party or end user) are entitled to view.
        In almost all cases, this means you must have a valid contract on the metering point in order to retrieve information about it.
      operationId: getContracts
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/Sender"
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: filter[contractType]
          in: query
          description: Filter by contract type. This is used to retrieve all records of a specific type; e.g., all contracts of type Norgespris.
          required: false
          schema:
            type: string
            enum:
              - Norgespris
        - name: filter[meteringPointId]
          in: query
          description: Filter list by metering point IDs (query limit size is 21). This is used to retrieve records based on the metering point ID.
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
            maxItems: 21
            uniqueItems: true
          example: ["845123456789323423", "845123456789323424"]
        - name: filter[updatedAt][gt]
          in: query
          description: Filter contracts updated after this timestamp (RFC 3339 format in Oslo time - Europe/Oslo timezone)
          required: false
          schema:
            type: string
            format: date-time
            example: "2025-09-02T09:28:00.00000+02:00"
        - name: filter[updatedAt][lt]
          in: query
          description: Filter contracts updated before this timestamp (RFC 3339 format in Oslo time - Europe/Oslo timezone)
          required: false
          schema:
            type: string
            format: date-time
            example: "2025-10-02T13:28:00.00000+02:00"
      responses:
        "200":
          description: Successfully get contracts
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ContractResponses"
              examples:
                success:
                  summary: Example response for get all contracts
                  value:
                    data:
                      - type: contract
                        id: 4ef727d1-b672-4166-a973-aa6e412b09bb
                        attributes:
                          contractType: Norgespris
                          startDate: "2026-01-01"
                          endDate: "2026-12-31"
                          status: Initiated
                        relationships:
                          createdBy:
                            data:
                              type: party
                              id: GLN1234567890123
                          updatedBy:
                            data:
                              type: party
                              id: GLN1234567890123
                          meteringPoint:
                            data:
                              type: metering-point
                              id: "845123456789323423"
                        meta:
                          createdAt: "2025-07-01T09:53:49.980467+02:00"
                          updatedAt: "2025-07-01T09:53:49.980467+02:00"
        "400":
          description: Bad Request - When the request is invalid
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingAttributes:
                  $ref: "#/components/examples/missingAttributes"
                missingRelationships:
                  $ref: "#/components/examples/missingRelationships"
                missingStatus:
                  $ref: "#/components/examples/missingStatus"
                invalidEndDate:
                  $ref: "#/components/examples/invalidEndDate"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  $ref: "#/components/examples/unauthorized"
        "500":
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internalError:
                  $ref: "#/components/examples/internalError"
    post:
      summary: Create a contract
      description: Create one or more contracts linked to meteringPointId(s).
      operationId: createContracts
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/Sender"
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateContractRequests"
            examples:
              createContracts:
                summary: Example request for creating contracts
                value:
                  data:
                    - type: contract
                      attributes:
                        contractType: Norgespris
                        startDate: "2026-01-01"
                        endDate: "2026-12-31"
                      relationships:
                        meteringPoint:
                          data:
                            type: metering-point
                            id: "845123456789323423"
      responses:
        "201":
          description: Successfully created contract
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ContractResponses"
              examples:
                created:
                  summary: Example response for created contract
                  value:
                    data:
                      - type: contract
                        id: 4ef727d1-b672-4166-a973-aa6e412b09bb
                        attributes:
                          contractType: Norgespris
                          startDate: "2026-01-01"
                          endDate: "2026-12-31"
                          status: Initiated
                        relationships:
                          createdBy:
                            data:
                              type: party
                              id: GLN1234567890123
                          updatedBy:
                            data:
                              type: party
                              id: GLN1234567890123
                          meteringPoint:
                            data:
                              type: metering-point
                              id: "845123456789323423"
                        meta:
                          createdAt: "2025-07-01T09:53:49.980467+02:00"
                          updatedAt: "2025-07-01T09:53:49.980467+02:00"
        "400":
          description: Bad Request - When the request is invalid
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingAttributes:
                  $ref: "#/components/examples/missingAttributes"
                missingRelationships:
                  $ref: "#/components/examples/missingRelationships"
                missingStatus:
                  $ref: "#/components/examples/missingStatus"
                invalidEndDate:
                  $ref: "#/components/examples/invalidEndDate"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  $ref: "#/components/examples/unauthorized"
        "403":
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorizedStatusUpdate:
                  $ref: "#/components/examples/unauthorizedStatusUpdate"
                endUserRestrictedFieldUpdate:
                  $ref: "#/components/examples/endUserRestrictedFieldUpdate"
        "409":
          description: Conflict - When the contract already exists
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                contractAlreadyExists:
                  $ref: "#/components/examples/contractAlreadyExists"
                meteringPointMismatch:
                  $ref: "#/components/examples/meteringPointMismatch"
                contractTypeMismatch:
                  $ref: "#/components/examples/contractTypeMismatch"
                invalidStatusTransition:
                  $ref: "#/components/examples/invalidStatusTransition"
        "500":
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internalError:
                  $ref: "#/components/examples/internalError"
    patch:
      summary: Update contracts
      description: Update a set of contracts.
      operationId: updateContracts
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/Sender"
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UpdateContractRequests"
            examples:
              updateContracts:
                summary: Example request for updating contracts
                value:
                  data:
                    - type: contract
                      id: 4ef727d1-b672-4166-a973-aa6e412b09bb
                      attributes:
                        contractType: Norgespris
                        startDate: "2026-01-01"
                        endDate: "2026-12-31"
                        isCancelled: true
                        cancelledAt: "2025-07-01T09:47:26.560233+02:00"
      responses:
        "200":
          description: Successfully updated contracts
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ContractResponses"
              examples:
                updated:
                  summary: Example response for updated contracts
                  value:
                    data:
                      - type: contract
                        id: 4ef727d1-b672-4166-a973-aa6e412b09bb
                        attributes:
                          contractType: Norgespris
                          startDate: "2026-01-01"
                          endDate: "2026-12-31"
                          status: Cancelled
                          cancelledAt: "2025-07-01T09:47:26.560233+02:00"
                        relationships:
                          createdBy:
                            data:
                              type: party
                              id: GLN1234567890123
                          updatedBy:
                            data:
                              type: party
                              id: GLN1234567890123
                          meteringPoint:
                            data:
                              type: metering-point
                              id: "845123456789323423"
                        meta:
                          createdAt: "2025-07-01T09:47:26.560233+02:00"
                          updatedAt: "2025-07-01T10:01:18.022467+02:00"
        "400":
          description: Bad Request - When the request is invalid
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingAttributes:
                  $ref: "#/components/examples/missingAttributes"
                missingRelationships:
                  $ref: "#/components/examples/missingRelationships"
                missingStatus:
                  $ref: "#/components/examples/missingStatus"
                invalidEndDate:
                  $ref: "#/components/examples/invalidEndDate"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  $ref: "#/components/examples/unauthorized"
        "403":
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorizedStatusUpdate:
                  $ref: "#/components/examples/unauthorizedStatusUpdate"
                endUserRestrictedFieldUpdate:
                  $ref: "#/components/examples/endUserRestrictedFieldUpdate"
        "404":
          description: Not Found - Contract not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                contractNotFound:
                  $ref: "#/components/examples/contractNotFound"
                contractNotFoundForMeteringPoint:
                  $ref: "#/components/examples/contractNotFoundForMeteringPoint"
        "409":
          description: Conflict - When trying to update with conflicting data
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                contractAlreadyExists:
                  $ref: "#/components/examples/contractAlreadyExists"
                meteringPointMismatch:
                  $ref: "#/components/examples/meteringPointMismatch"
                contractTypeMismatch:
                  $ref: "#/components/examples/contractTypeMismatch"
                invalidStatusTransition:
                  $ref: "#/components/examples/invalidStatusTransition"
        "500":
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internalError:
                  $ref: "#/components/examples/internalError"
  /contracts/{contractId}:
    get:
      summary: Get a single contract by ID
      description: Get a single contract entity identified by ID.
      operationId: getContractById
      parameters:
        - name: contractId
          in: path
          description: The ID of the contract to retrieve.
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/Sender"
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "200":
          description: Successfully get contract by ID
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SingleContractResponse"
              examples:
                success:
                  summary: Example response for get contract by ID
                  value:
                    data:
                      type: contract
                      id: 4ef727d1-b672-4166-a973-aa6e412b09bb
                      attributes:
                        contractType: Norgespris
                        startDate: "2026-01-01"
                        endDate: "2026-12-31"
                        status: Cancelled
                        cancelledAt: "2025-07-01T09:55:49.980467+02:00"
                      relationships:
                        createdBy:
                          data:
                            type: party
                            id: GLN1234567890123
                        updatedBy:
                          data:
                            type: party
                            id: GLN1234567890123
                        meteringPoint:
                          data:
                            type: metering-point
                            id: "845123456789323423"
                      meta:
                        createdAt: "2026-01-01T09:47:26.560233+02:00"
                        updatedAt: "2026-06-01T09:47:26.560233+02:00"
        "400":
          description: Bad Request - When the request is invalid
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingAttributes:
                  $ref: "#/components/examples/missingAttributes"
                missingRelationships:
                  $ref: "#/components/examples/missingRelationships"
                missingStatus:
                  $ref: "#/components/examples/missingStatus"
                invalidEndDate:
                  $ref: "#/components/examples/invalidEndDate"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  $ref: "#/components/examples/unauthorized"
        "404":
          description: Not Found - Contract not found
          content:
            application/vnd.api+json:
