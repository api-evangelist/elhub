  /data-export/v0/energy-data/files/{id}:
    get:
      tags:
      - data-export
      summary: Retrieve a file associated with the specified fileId from a data export
        job.
      description: |-
        This endpoint redirects to download the file associated with the given FileId.

        This is a protected endpoint and should be accessed with a Maskinporten token as a Bearer token along with the below header:

        X-Elhub-GLN : your-gln-value

        The FileId should be obtained from our Job endpoint, which is linked to your GLN.
        The file format and structure vary depending on the Job type.
        For Portfolio Move, files are exported in CSV format and compressed using GZIP.

        <table style='width:100%'>
          <tr style='text-align:left'>
            <th width='200px'>Column</th>
            <th width='50px'>Type</th>
            <th>Description</th>
            <th>Example</th>
          </tr>
          <tr>
            <td>METERING_POINT_ID</td>
            <td>String</td>
            <td>Requested metering point id. All metering points IDs in the messages are identified by using GSRN (Global Service Relation Number) issued by GS1. These are unique identifiers containing 18 digit numbers. Example: 707057500012345678. More info: https://gs1.no/malepunkt-id/</td>
            <td>707057500012345678</td>
          </tr>
          <tr>
            <td>RESOLUTION</td>
            <td>String</td>
            <td>Resolution, either PT60M or PT15M</td>
            <td>PT60M</td>
          </tr>
          <tr>
            <td>DIRECTION</td>
            <td>String</td>
            <td>Direction, either In or Out</td>
            <td>In</td>
          </tr>
          <tr>
            <td>PRODUCT_CODE</td>
            <td>String</td>
            <td>GS1 code, e.g., 8716867000030</td>
            <td>8716867000030</td>
          </tr>
          <tr>
            <td>START_TIME</td>
            <td>String</td>
            <td>Start of interval in ISO-8601 format with offset in Europe/Oslo timezone</td>
            <td>2023-04-05T01:00:00+02:00</td>
          </tr>
          <tr>
            <td>END_TIME</td>
            <td>String</td>
            <td>End of interval in ISO-8601 format with offset in Europe/Oslo timezone</td>
            <td>2023-04-05T02:00:00+02:00</td>
          </tr>
          <tr>
            <td>INSERT_DATE_TIME</td>
            <td>String</td>
            <td>Time when the measurement value was stored in Elhub</td>
            <td>2024-04-22T09:00:00+02:00</td>
          </tr>
          <tr>
            <td>QUANTITY</td>
            <td>String</td>
            <td>Volume in kWh</td>
            <td>100.253</td>
          </tr>
        </table>
      operationId: energy_data_file_id
      parameters:
      - name: Authorization
        in: header
        description: "Include the bearer token obtained from Maskinporten in the Authorization\
          \ header. Format: 'Bearer <token>'."
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the on behalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: id
        in: path
        description: Valid file id returned from Job /energy-data endpoint
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: e128b01f-7767-4cc5-9801-c5f28220521a
      responses:
        "302":
          description: "When file exists, a redirect response is returned with the\
            \ final location URL"
          headers:
            Location:
              description: Final redirect target (pre-signed download URL)
              required: false
              deprecated: false
              schema:
                type: string
                title: String
        "400":
          description: When file id is not a valid UUID
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Invalid Request:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "400",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:15:45+01:00",
                          "links": {
                            "self": "https://api.elhub.no/energy-data/v0/energy-data/files/{id}"
                          }
                        }
                      ]
                    }
        "404":
          description: When file is not found in the job pool
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Requested resource not found:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "404",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:41:55+01:00"
                        }
                      ]
                    }
        "500":
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Unexpected server error:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "500",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:38:13+01:00"
                        }
                      ]
                    }
        "401":
          description: The request lacks valid authentication credentials
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Missing authentication:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "401",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:40:21+01:00"
                        }
                      ]
                    }
        "403":
          description: When the request lacks valid authorization
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Unauthorized request:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "403",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:41:55+01:00"
                        }
                      ]
                    }
      deprecated: false
