openapi: 3.1.0
info:
  title: Data Export API
  description: |-
    The Data Export API endpoints provide various energy data file exports to serve multiple requirements. \
    These exports are generated by on demand or scheduled jobs. There are multiple <b>Job Types</b> that provide different sets of data in the file exports. \
    Market parties gain access to fetch files for different <b>Job Types</b> depending on their needs and their access level to the data. \
    Elhub controls the access via Maskinporten scopes. \
    This API returns JSON in the JSON:API v1.1 format. Visit https://jsonapi.org for more information. \
    <b>This is a v0 API. Breaking changes may come to the API endpoints in the future.</b>
  version: v0
externalDocs:
  url: /
servers: []
tags: []
paths:
  /data-export/v0/secure-ping:
    get:
      tags:
      - Secure ping
      summary: Secure ping endpoint
      parameters:
      - name: Authorization
        in: header
        description: "Include the bearer token obtained from Maskinporten in the Authorization\
          \ header. Format: `Bearer <token>`."
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: Bearer eyJhbGciOi...
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the onbehalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          description: Successful ping response when the token is valid
          headers: {}
          content:
            application/json:
              schema:
                type: string
                title: String
              examples:
                pong:
                  summary: Pong response
                  value: "{\"message\": \"Pong! Elhoo.\"}"
        "401":
          description: The request lacks valid authentication credentials
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                unauthorized:
                  value: "{\"errors\":[{\"status\":\"401\",\"title\":\"Unauthorized\"\
                    ,\"detail\":\"creationTime: 2026-09-29T15:38:15+02:00\",\"links\"\
                    :{\"self\":\"https://api.elhub.no/energy-data/v0/secure-ping\"\
                    }}]}"
        "403":
          description: Authenticated but not authorized to access the resource
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                forbidden:
                  value: "{\"errors\":[{\"status\":\"403\",\"title\":\"Forbidden\"\
                    ,\"detail\":\"creationTime: 2026-09-29T15:38:15+02:00\",\"links\"\
                    :{\"self\":\"https://api.elhub.no/energy-data/v0/secure-ping\"\
                    }}]}"
        "500":
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                unexpectedError:
                  value: "{\"errors\":[{\"status\":\"500\",\"title\":\"Unexpected\
                    \ server error. Try again later.\",\"detail\":\"creationTime:\
                    \ 2026-09-29T15:38:15+02:00\",\"links\":{\"self\":\"https://api.elhub.no/energy-data/v0/secure-ping\"\
                    }}]}"
      deprecated: false
  /data-export/v0/energy-data:
    get:
      tags:
      - data-export
      summary: Retrieve a list of available data export job and file IDs for your
        GLN.
      description: |-
        This endpoint retrieves a list of data export job IDs associated with the GLN specified in the request, along with the file IDs generated for each job.

        This is a protected endpoint and should be accessed with a Maskinporten token as a Bearer token along with the below header:

        X-Elhub-GLN : your-gln-value

        Sample Response:
        <pre style='color:#333333;background-color:#dddddd'>
        {
          \"meta\": { \"created\": \"2024-04-22T22:33:21+02:00\" },
          \"links\": { \"self\": \"https://api.elhub.no/data-export/v0/energy-data\" },
          \"data\": [ { \"type\": \"job\", \"id\": \"3f3e62bb-ed02-45fa-a951-a979491524a3\" } ]
        }
        </pre>
      operationId: energy_data
      parameters:
      - name: Authorization
        in: header
        description: "Include the bearer token obtained from Maskinporten in the Authorization\
          \ header. Format: 'Bearer <token>'."
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the on behalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          description: When the request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/no.elhub.ds.energy.data.models.response.DataExportResponse"
        "500":
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Unexpected server error:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "500",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:38:13+01:00"
                        }
                      ]
                    }
        "401":
          description: The request lacks valid authentication credentials
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Missing authentication:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "401",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:40:21+01:00"
                        }
                      ]
                    }
        "403":
          description: When the request lacks valid authorization
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Unauthorized request:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "403",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:41:55+01:00"
                        }
                      ]
                    }
      deprecated: false
