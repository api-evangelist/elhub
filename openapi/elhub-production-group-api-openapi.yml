openapi: 3.2.0
info:
  title: Energy Data Production group API
  description: 'V0: This API is currently accessible to the public, and we anticipate future updates and enhancements.'
  version: v0
servers: []
tags:
- name: Production group
paths:
  /energy-data/v0/production-groups:
    get:
      tags:
      - Production group
      summary: List of production groups
      operationId: production_groups
      parameters: []
      responses:
        '200':
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.ProductionGroupResponse'
              examples:
                validRequest:
                  summary: Valid request
                  value: '{"meta":{"created":"2024-11-06T09:12:30+01:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/production-groups"},"data":[{"type":"production-groups","id":"solar","attributes":{"name":"Solar","description":"Unit in which solar energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"hydro","attributes":{"name":"Hydro","description":"Unit in which moving water energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"wind","attributes":{"name":"Wind","description":"Unit in which wind energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"thermal","attributes":{"name":"Thermal","description":"Unit in which heat energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"nuclear","attributes":{"name":"Nuclear","description":"Unit in which the heat source is a nuclear reactor with unspecified equipment/devices."}},{"type":"production-groups","id":"other","attributes":{"name":"Other","description":"Other unspecified technology."}}]}'
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                invalidRequest:
                  value: '{"errors":[{"status":"400","title":"Invalid request","detail":"creationTime: 2026-09-29T15:38:35+02:00","links":{"self":"https://api.elhub.no/production-groups"}}]}'
        '500':
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                unexpectedServerError:
                  summary: Unexpected server error
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"500\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:38:13+01:00\"\n    }\n  ]\n}"
      deprecated: false
  /energy-data/v0/production-groups/{id}:
    get:
      tags:
      - Production group
      summary: Get a specific production group by ID
      operationId: production_groups_id
      parameters:
      - name: id
        in: path
        description: A valid production group id returned from /production-groups
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: solar
      responses:
        '200':
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.ProductionGroupResponse'
              examples:
                validRequest:
                  summary: Valid request
                  value: '{"meta":{"created":"2024-11-06T09:12:30+01:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/production-groups"},"data":[{"type":"production-groups","id":"solar","attributes":{"name":"Solar","description":"Unit in which solar energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"hydro","attributes":{"name":"Hydro","description":"Unit in which moving water energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"wind","attributes":{"name":"Wind","description":"Unit in which wind energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"thermal","attributes":{"name":"Thermal","description":"Unit in which heat energy is converted to electricity with unspecified equipment/devices."}},{"type":"production-groups","id":"nuclear","attributes":{"name":"Nuclear","description":"Unit in which the heat source is a nuclear reactor with unspecified equipment/devices."}},{"type":"production-groups","id":"other","attributes":{"name":"Other","description":"Other unspecified technology."}}]}'
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                invalidRequest:
                  value: '{"errors":[{"status":"400","title":"Invalid request","detail":"creationTime: 2026-09-29T15:38:35+02:00","links":{"self":"https://api.elhub.no/production-groups/{id}"}}]}'
        '500':
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                unexpectedServerError:
                  summary: Unexpected server error
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"500\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:38:13+01:00\"\n    }\n  ]\n}"
      deprecated: false
