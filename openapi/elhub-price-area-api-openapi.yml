openapi: 3.2.0
info:
  title: Energy Data Price area API
  description: 'V0: This API is currently accessible to the public, and we anticipate future updates and enhancements.'
  version: v0
servers: []
tags:
- name: Price area
paths:
  /energy-data/v0/price-areas:
    get:
      tags:
      - Price area
      summary: Get list of price areas and aggregations
      operationId: price_areas
      parameters:
      - name: dataset
        in: query
        description: The dataset name.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: ConsumptionPerGroupMbaHour
      - name: startDate
        in: query
        description: 'Start date (Format: yyyy-MM-dd''T''HH:mm:ssXXX at Europe/Oslo timezone) of aggregated data (inclusive). If empty, it will be set to a date one month in the past from endDate.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: 2023-04-05 03:00:00+02:00
      - name: endDate
        in: query
        description: 'End date (Format: yyyy-MM-dd''T''HH:mm:ssXXX at Europe/Oslo timezone) of aggregated data (inclusive). The time period from startDate to endDate cannot exceed one month. If empty, it will be set to current date and startDate will be set to a date one month in the past.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: 2023-04-15 03:00:00+02:00
      - name: consumptionGroup
        in: query
        description: The consumption group.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: household
      - name: productionGroup
        in: query
        description: The production group.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: hydro
      - name: estimatedAnnualConsumption
        in: query
        description: The estimated annual consumption, integer between 1 and 500000
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: '10000'
      - name: Authorization
        in: header
        description: 'Include the bearer token obtained from Maskinporten in the Authorization header. Format: ''Bearer <token>''.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the onbehalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        '200':
          description: When request is OK. Choose a different dataset under 'Examples' to see different responses
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.PriceAreaResponse'
