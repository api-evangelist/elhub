        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: household
      - name: productionGroup
        in: query
        description: The production group.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: hydro
      - name: estimatedAnnualConsumption
        in: query
        description: The estimated annual consumption, integer between 1 and 500000
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: '10000'
      - name: Authorization
        in: header
        description: 'Include the bearer token obtained from Maskinporten in the Authorization header. Format: ''Bearer <token>''.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: false
        deprecated: false
        explode: false
        schema:
