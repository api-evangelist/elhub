                ProductionPerGroupMba15Min:
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas?dataset=ProductionPerGroupMba15Min"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO","ProductionPerGroupMba15Min":[{"endTime":"String","lastUpdatedTime":"String","priceArea":"String","productionGroup":"String","quantityKwh":"Float","startTime":"String"}]}}]}'
                ExchangePerMbaHour:
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas?dataset=ExchangePerMbaHour"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO","ExchangePerMbaHour":[{"adjacentPriceArea":"String","endTime":"String","exchangeInQuantityKwh":"Float","exchangeOutQuantityKwh":"Float","lastUpdatedTime":"String","priceArea":"String","startTime":"String"}]}}]}'
                ExchangePerMba15Min:
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas?dataset=ExchangePerMba15Min"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO","ExchangePerMba15Min":[{"adjacentPriceArea":"String","endTime":"String","exchangeInQuantityKwh":"Float","exchangeOutQuantityKwh":"Float","lastUpdatedTime":"String","priceArea":"String","startTime":"String"}]}}]}'
                LossPerMbaHour:
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas?dataset=LossPerMbaHour"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO","LossPerMbaHour":[{"calculateLossFraction":"Float","calculatedLossQuantityKwh":"Float","consumptionQuantityKwh":"Float","endTime":"String","exchangeInQuantityKwh":"Float","exchangeOutQuantityKwh":"Float","lastUpdatedTime":"String","netInfeedQuantityKwh":"Float","priceArea":"String","productionQuantityKwh":"Float","startTime":"String"}]}}]}'
                CompletenessDailyPerBalanceSupplierMba:
