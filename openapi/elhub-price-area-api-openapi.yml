  /energy-data/v0/price-areas/{id}:
    get:
      tags:
      - Price area
      summary: Get list of price areas and aggregations
      operationId: price_areas_id
      parameters:
      - name: id
        in: path
        description: A valid price area id returned from /price-areas
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: NO1
      - name: dataset
        in: query
        description: The dataset name.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: ConsumptionPerGroupMbaHour
      - name: startDate
        in: query
        description: 'Start date (Format: yyyy-MM-dd''T''HH:mm:ssXXX at Europe/Oslo timezone) of aggregated data (inclusive). If empty, it will be set to a date one month in the past from endDate.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: 2023-04-05 03:00:00+02:00
      - name: endDate
