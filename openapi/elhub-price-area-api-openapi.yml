              examples:
                Unexpected server error:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"500\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:38:13+01:00\"\n    }\n  ]\n}"
        '401':
          description: The request lacks valid authentication credentials
          headers: {}
          content:
            application/vnd.api+json:
              schema:
