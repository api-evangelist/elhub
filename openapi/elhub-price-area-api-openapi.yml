          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.PriceAreaResponse'
              examples:
                '[No dataset chosen]':
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO"}}]}'
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                Invalid request:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"400\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:15:45+01:00\",\n      \"links\": {\n        \"self\": \"https://api.elhub.no/energy-data/v0/price-areas/{id}\"\n      }\n    }\n  ]\n}"
        '500':
