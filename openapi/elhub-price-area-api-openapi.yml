components:
  schemas:
    no.elhub.ds.energy.data.models.pricearea.ConsumptionPerGroupMbaHour:
      type: object
      properties:
        consumptionGroup:
          type:
          - 'null'
          - string
          description: The consumption group
          title: String
        endTime:
          type:
          - 'null'
          - string
          description: End time of the interval
          title: String
        lastUpdatedTime:
          type:
          - 'null'
          - string
          description: Last updated time for the row.
          title: String
        meteringPointCount:
          type:
          - 'null'
          - integer
          format: int32
          description: Number of metering points that are part of the aggregate
          title: Int
        priceArea:
          type:
          - 'null'
          - string
          description: The price area
          title: String
        quantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: The quantity in kWh for the aggregate
          title: Float
        startTime:
          type:
          - 'null'
          - string
          description: Start time of the interval
          title: String
      title: ConsumptionPerGroupMbaHour
    no.elhub.ds.energy.data.models.pricearea.LossPerMbaHour:
      type: object
      properties:
        calculateLossFraction:
          type: number
          format: float
          description: calculatedLossQuantityKwh divided by netInfeedQuantityKwh. Multiply with 100 to get percentage. Will be 0 if net infeed is 0.
          title: Float
        calculatedLossQuantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: The loss in kwh. Includes no balance supplier loss. Calculated as production + exchange in - exchange out - consumption.
          title: Float
        consumptionQuantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: Consumption quantity in kwh. Includes interval consumption(including consumption from combined metering points) and profile consumption
          title: Float
        endTime:
          type:
          - 'null'
          - string
          description: The end time of the interval
          title: String
        exchangeInQuantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: The exchange quantity in kWh for the IN direction
          title: Float
        exchangeOutQuantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: The exchange quantity in kWh for the OUT direction
          title: Float
        lastUpdatedTime:
          type:
          - 'null'
          - string
          description: Last updated time for the row.
          title: String
        netInfeedQuantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: The net infeed in kwh. Calculated as production + exchange in - exchange out
          title: Float
        priceArea:
          type:
          - 'null'
          - string
          description: The price area
          title: String
        productionQuantityKwh:
          type:
          - 'null'
          - number
          format: float
          description: Production quantity in kwh
          title: Float
        startTime:
          type:
          - 'null'
          - string
          description: The start time of the interval
          title: String
      required:
      - calculateLossFraction
      title: LossPerMbaHour
    no.elhub.ds.energy.data.models.pricearea.ProductionPerBalanceResponsibleMeteringPointTypeCodeMbaHour:
      type: object
