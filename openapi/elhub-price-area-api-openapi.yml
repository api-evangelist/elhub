                NorgesprisConsumptionPerGroupEacMba:
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas?dataset=NorgesprisConsumptionPerGroupEacMbaHour"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO","NorgesprisConsumptionPerGroupEacMbaHour":[{"consumptionGroup":"String","endTime":"String","estimatedAnnualConsumptionFrom":"Long","estimatedAnnualConsumptionTo":"Long","lastUpdatedTime":"String","meteringPointCountNorwayPrice":"Int","meteringPointCountNotNorwayPrice":"Int","quantityKwhNorwayPrice":"Float","quantityKwhNotNorwayPrice":"Float","startTime":"String","totalMeteringPointCount":"Int","totalQuantityKwh":"Float"}]}}]}'
        '400':
