  /energy-data/v0/price-areas{suffix}:
    get:
      tags:
      - Price area
      summary: Get list of price areas and aggregations
      operationId: price_areas_export
      parameters:
      - name: suffix
        in: path
        description: Suffix to specify type of data returned.
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: .csv
      - name: dataset
        in: query
        description: The dataset name.
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: ConsumptionPerGroupMbaHour
      - name: Authorization
        in: header
        description: 'Include the bearer token obtained from Maskinporten in the Authorization header. Format: ''Bearer <token>''.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the onbehalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        '302':
          description: CSV export redirect
          headers:
            Location:
              description: Redirect target (download URL)
              required: false
              deprecated: false
              schema:
                type: string
                title: String
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                Invalid request:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"400\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:15:45+01:00\",\n      \"links\": {\n        \"self\": \"https://api.elhub.no/energy-data/v0/price-areas{suffix}\"\n      }\n    }\n  ]\n}"
        '500':
          description: Unexpected server error
          headers: {}
          content:
