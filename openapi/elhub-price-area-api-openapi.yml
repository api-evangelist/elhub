                '[No dataset chosen]':
                  value: '{"meta":{"created":"2023-10-01T12:00:00+02:00","lastUpdated":"2023-10-18T12:00:00+02:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/price-areas"},"data":[{"type":"price-areas","id":"NO1","attributes":{"name":"NO5","eic":"String","country":"NO"}}]}'
                CompletenessDailyPerMba:
