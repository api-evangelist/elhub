openapi: 3.2.0
info:
  title: Energy Data Updates API
  description: 'V0: This API is currently accessible to the public, and we anticipate future updates and enhancements.'
  version: v0
servers: []
tags:
- name: Updates
paths:
  /energy-data/v0/updates:
    get:
      tags:
      - Updates
      summary: Provides updates about changes in dataset
      parameters:
      - name: lastUpdated
        in: query
        description: 'Updates that occurred on or after the specified `lastUpdated` time (Format: `yyyy-MM-dd''T''HH:mm:ssXXX` at Europe/Oslo timezone). If `lastUpdated` is not provided, it defaults to 24 hours before the current time.'
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: 2023-04-05 03:00:00+02:00
      - name: dataset
        in: query
        description: The dataset name.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: consumption_per_group_mba_hour
      responses:
        '200':
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.UpdatesResponse'
              examples:
                consumption_per_group_mba_hour:
                  summary: consumption_per_group_mba_hour
                  value: '{"meta":{"created":"2024-11-06T09:28:20+01:00","lastUpdated":"2024-11-06T09:28:20+01:00"},"links":{"self":"https://api.elhub.no/energy-data/v0/updates?dataset=consumption_per_group_mba_hour"},"data":[{"type":"updates","id":"20241030_consumption_per_group_mba_hour","links":{"href":"https://api.elhub.no/energy-data/v0/price-areas?dataset=consumption_per_group_mba_hour&startDate=2024-10-30&endDate=2024-10-31"},"attributes":{"dataset":"consumption_per_group_mba_hour","entity":"price-areas","usageDate":"2024-10-30","updateTime":"2024-11-05T13:41:33+01:00"}},{"type":"updates","id":"20241031_consumption_per_group_mba_hour","links":{"href":"https://api.elhub.no/energy-data/v0/price-areas?dataset=consumption_per_group_mba_hour&startDate=2024-10-31&endDate=2024-11-01"},"attributes":{"dataset":"consumption_per_group_mba_hour","entity":"price-areas","usageDate":"2024-10-31","updateTime":"2024-11-05T13:41:36+01:00"}}]}'
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                invalidRequest:
                  value: '{"errors":[{"status":"400","title":"Invalid request","detail":"creationTime: 2026-09-29T15:38:35+02:00","links":{"self":"https://api.elhub.no/updates"}}]}'
        '500':
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                unexpectedServerError:
                  value: '{"errors":[{"status":"500","title":"Unexpected server error. Try again later.","detail":"creationTime: 2026-09-29T15:38:35+02:00","links":{"self":"https://api.elhub.no/updates"}}]}'
      deprecated: false
      operationId: getEnergyDataV0Updates
      x-operation-id-source: derived
components:
  schemas:
    jsonapi.Links:
      type: object
      properties:
        members:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/jsonapi.Link'
          title: Map<String,Link>
      required:
      - members
      title: Links
    jsonapi.Link.URI:
      type: object
      properties:
        value:
          type: string
          title: String
      required:
      - value
      title: Link.URI
    no.elhub.ds.energy.data.models.response.UpdatesResponse:
      type: object
      properties:
        creationTime:
          type: string
          description: timestamp of this response creation, in yyyy-MM-dd'T'HH:mm:ssXXX format
          title: String
        currentLink:
          type:
          - 'null'
          - string
          description: link to the current resource
          title: String
        lastUpdatedTime:
          type:
          - 'null'
          - string
          description: timestamp for the last update time of this response's content, in yyyy-MM-dd'T'HH:mm:ssXXX format
          title: String
        updates:
          type:
          - 'null'
          - array
          description: list of updates
          items:
            $ref: '#/components/schemas/no.elhub.ds.energy.data.models.Update'
          title: List<Update>
      required:
      - creationTime
      title: UpdatesResponse
    no.elhub.ds.energy.data.models.Update:
      type: object
      properties:
        dataset:
          type:
          - 'null'
          - string
          description: Dataset name
          title: String
        endDateTime:
          type:
          - 'null'
          - string
          description: End time of the interval, Used in hourly updates
          title: String
        entity:
          type:
          - 'null'
          - string
          description: Entity the dataset belongs to
          title: String
        id:
          type:
          - 'null'
          - string
          description: Update id
          title: String
        links:
          description: Links object
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/jsonapi.Links'
        startDateTime:
          type:
          - 'null'
          - string
          description: Start time of the interval, Used in hourly updates
          title: String
        updateTime:
          type:
          - 'null'
          - string
          description: Update time
          title: String
        usageDate:
          type:
          - 'null'
          - string
          description: Usage date the update happened
          title: String
      title: Update
    jsonapi.Error:
      type: object
      properties:
        code:
          type:
          - 'null'
          - string
          title: String
        detail:
          type:
          - 'null'
          - string
          title: String
        id:
          type:
          - 'null'
          - string
          title: String
        links:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/jsonapi.Links'
        meta:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/jsonapi.Meta'
        source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/jsonapi.Error.Source'
        status:
          type:
          - 'null'
          - string
          title: String
        title:
          type:
          - 'null'
          - string
          title: String
      title: Error
    jsonapi.Link.LinkObject:
      type: object
      properties:
        describedBy:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/jsonapi.Link'
        href:
          type: string
          title: String
        hreflang:
          type:
          - 'null'
          - array
          items:
            type: string
            title: String
          title: List<String>
        meta:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/jsonapi.Meta'
        rel:
          type:
          - 'null'
          - string
          title: String
        title:
          type:
          - 'null'
          - string
          title: String
        type:
          type:
          - 'null'
          - string
          title: String
      required:
      - href
      title: Link.LinkObject
    jsonapi.Meta:
      type: object
      properties:
        members:
          type: object
          additionalProperties:
            type: object
            title: Any
          title: Map<String,Any>
      required:
      - members
      title: Meta
    jsonapi.Link:
      anyOf:
      - $ref: '#/components/schemas/jsonapi.Link.LinkObject'
      - $ref: '#/components/schemas/jsonapi.Link.URI'
      title: Link
    jsonapi.Error.Source:
      type: object
      properties:
        header:
          type:
          - 'null'
          - string
          title: String
        parameter:
          type:
          - 'null'
          - string
          title: String
        pointer:
          type:
          - 'null'
          - string
          title: String
      title: Error.Source
externalDocs:
  url: /
