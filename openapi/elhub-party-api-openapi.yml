          description: Conflict
      security:
      - bearerAuth:
        - manage:data:party
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
    servers:
    - url: https://test.flex.internal:6443/api/v1
      description: Development
  /party_history:
    summary: Party - history
    description: ''
    parameters:
    - in: query
      schema:
        type: string
        pattern: ^eq\.[0-9]+$
      example: eq.55
      description: Identifier of the history record.
      name: id
    - in: query
      schema:
        type: string
        pattern: ^eq\.[0-9]+$
      example: eq.55
      description: Identifier of the Party whose history we want to inspect.
      name: party_id
    get:
      operationId: list_party_history
      summary: List Party - history
      tags:
      - Party
      parameters:
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Unique surrogate identifier.
        name: id
      - in: query
        name: business_id
        schema:
          type: string
        example: eq.somebusiness_id
        description: The business identifier of the party. Format depends on `business_id_type`.
      - in: query
        name: business_id_type
        schema:
          type: string
        example: eq.somebusiness_id_type
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Reference to the entity that is the parent of the party.
        name: entity_id
      - in: query
        name: name
        schema:
          type: string
