openapi: 3.2.0
info:
  title: Elhub Party API
  version: '1.0'
  description: 'Operations tagged Party across 3 of this provider''s published API definitions: elhub-energy-data-api-openapi.yaml, elhub-flex-information-system-main-api-openapi.json, elhub-postgrest-openapi-3-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test.flex.internal:6443/api/v1
  description: Development
- url: http://localhost:3000/
tags:
- name: Party
paths:
  /energy-data/v0/parties:
    get:
      tags:
      - Party
      summary: Get list of parties
      operationId: parties
      parameters: []
      responses:
        '200':
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.PartyResponse'
              examples:
                PartyExample:
                  summary: PartyExample
                  value: '{"meta":{"created":"2024-10-29T12:16:37+01:00"},"links":{"self":"api.elhub.no/energy-data/v0/parties"},"data":[{"type":"parties","id":"String","attributes":{"gln":"String","partyTypes":["String"],"name":"String","organisationNumber":"String"},"relationships":{"grid-area":{"data":[{"type":"grid-areas","id":"String"}]}}},{"type":"grid-areas","id":"String","attributes":{"name":"String","status":"String","eic":"String"},"relationships":{"price-area":{"data":{"type":"price-areas","id":"String"}}}},{"type":"price-areas","id":"String","attributes":{"name":"String","eic":"String","country":"String"}}]}'
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                Invalid request:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"400\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:15:45+01:00\",\n      \"links\": {\n        \"self\": \"https://api.elhub.no/energy-data/v0/parties\"\n      }\n    }\n  ]\n}"
        '500':
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                Unexpected server error:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"500\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:38:13+01:00\"\n    }\n  ]\n}"
      deprecated: false
  /energy-data/v0/parties/{id}:
    get:
      tags:
      - Party
      summary: Get list of parties
      operationId: parties_id
      parameters:
      - name: id
        in: path
        description: A valid party id returned from /parties
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: '8000400000039'
      responses:
        '200':
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/no.elhub.ds.energy.data.models.response.PartyResponse'
              examples:
                PartyExample:
                  summary: PartyExample
                  value: '{"meta":{"created":"2024-10-29T12:16:37+01:00"},"links":{"self":"api.elhub.no/energy-data/v0/parties"},"data":[{"type":"parties","id":"String","attributes":{"gln":"String","partyTypes":["String"],"name":"String","organisationNumber":"String"},"relationships":{"grid-area":{"data":[{"type":"grid-areas","id":"String"}]}}},{"type":"grid-areas","id":"String","attributes":{"name":"String","status":"String","eic":"String"},"relationships":{"price-area":{"data":{"type":"price-areas","id":"String"}}}},{"type":"price-areas","id":"String","attributes":{"name":"String","eic":"String","country":"String"}}]}'
        '400':
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                Invalid request:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"400\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:15:45+01:00\",\n      \"links\": {\n        \"self\": \"https://api.elhub.no/energy-data/v0/parties/{id}\"\n      }\n    }\n  ]\n}"
        '500':
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/jsonapi.Error'
              examples:
                Unexpected server error:
                  value: "{\n  \"errors\": [\n    {\n      \"status\": \"500\",\n      \"title\": \"String\",\n      \"detail\": \"creationTime: 2024-10-28T14:38:13+01:00\"\n    }\n  ]\n}"
      deprecated: false
  /party:
    summary: Party
    description: ''
    get:
      operationId: list_party
      summary: List Party
      tags:
      - Party
      parameters:
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Unique surrogate identifier.
        name: id
      - in: query
        name: business_id
        schema:
          type: string
        example: eq.somebusiness_id
        description: The business identifier of the party. Format depends on `business_id_type`.
      - in: query
        name: business_id_type
        schema:
          type: string
        example: eq.somebusiness_id_type
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Reference to the entity that is the parent of the party.
        name: entity_id
      - in: query
        name: name
        schema:
          type: string
        example: eq.somename
        description: Name of the party. Maximum 128 characters.
      - description: Filtering Columns
        in: query
        name: select
        schema:
          type: string
      - description: Ordering
        in: query
        name: order
        schema:
          type: string
      - description: Limiting and Pagination
        in: query
        name: offset
        schema:
          type: string
      - description: Limiting and Pagination
        in: query
        name: limit
        schema:
          type: string
      - in: query
        name: embed
        schema:
          type: string
        description: Comma-separated list of related resources to embed in the response.
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/party_response'
                type: array
          description: OK
        '206':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/party_response'
                type: array
          description: Partial Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error_message'
                - $ref: '#/components/schemas/empty_object'
          description: Not Found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Not Acceptable
        '416':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Range Not Satisfiable
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Internal Server Error
      security:
      - bearerAuth:
        - read:data:party
      - {}
    post:
      operationId: create_party
      summary: Create Party
      tags:
      - Party
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/party_create_request'
        description: party
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/party_response'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error_message'
                - $ref: '#/components/schemas/empty_object'
          description: Not Found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Not Acceptable
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Internal Server Error
      security:
      - bearerAuth:
        - manage:data:party
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
    delete:
      parameters:
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: business_id
        schema:
          type: string
      - in: query
        name: business_id_type
        schema:
          type: string
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: recorded_by
        schema:
          type: string
      - in: query
        name: recorded_at
        schema:
          type: string
      - description: Preference
        in: header
        name: Prefer
        schema:
          enum:
          - return=representation
          - return=minimal
          - return=none
          type: string
      responses:
        '204':
          content: {}
          description: No Content
      tags:
      - Party
      summary: Delete party
      x-summary-source: derived
      operationId: deleteParty
      x-operation-id-source: derived
    patch:
      parameters:
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: business_id
        schema:
          type: string
      - in: query
        name: business_id_type
        schema:
          type: string
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: recorded_by
        schema:
          type: string
      - in: query
        name: recorded_at
        schema:
          type: string
      - description: Preference
        in: header
        name: Prefer
        schema:
          enum:
          - return=representation
          - return=minimal
          - return=none
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/party'
          application/vnd.pgrst.object+json;nulls=stripped:
            schema:
              $ref: '#/components/schemas/party'
          application/vnd.pgrst.object+json:
            schema:
              $ref: '#/components/schemas/party'
          text/csv:
            schema:
              $ref: '#/components/schemas/party'
        description: party
        required: false
      responses:
        '204':
          content: {}
          description: No Content
      tags:
      - Party
      x-codegen-request-body-name: party
      summary: Update party
      x-summary-source: derived
      operationId: patchParty
      x-operation-id-source: derived
    servers:
    - url: https://test.flex.internal:6443/api/v1
      description: Development
  /party/{id}:
    summary: Party - single
    description: ''
    parameters:
    - in: path
