      title: ConsumptionGroupResponse
    no.elhub.ds.energy.data.models.ConsumptionGroup:
      type: object
      properties:
        description:
          type:
          - 'null'
          - string
          description: Consumption group description
          title: String
        id:
          type: string
          description: Consumption group id
          title: String
        name:
          type:
          - 'null'
          - string
          description: Consumption group name
          title: String
