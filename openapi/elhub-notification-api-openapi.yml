openapi: 3.2.0
info:
  title: Elhub Notification API
  version: '1.0'
  description: 'Operations tagged notification across 2 of this provider''s published API definitions: elhub-flex-information-system-main-api-openapi.json, elhub-postgrest-openapi-3-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test.flex.internal:6443/api/v1
  description: Development
- url: http://localhost:3000/
tags:
- name: Notification
  description: Notification
paths:
  /notification:
    summary: Notification
    description: ''
    get:
      operationId: list_notification
      summary: List Notification
      tags:
      - Notification
      parameters:
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Unique surrogate identifier.
        name: id
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Reference to the event notified by this resource.
        name: event_id
      - in: query
        schema:
          type: string
          pattern: ^eq\.[0-9]+$
        example: eq.55
        description: Reference to the party concerned by this notification.
        name: party_id
      - description: Filtering Columns
        in: query
        name: select
        schema:
          type: string
      - description: Ordering
        in: query
        name: order
        schema:
          type: string
      - description: Limiting and Pagination
        in: query
        name: offset
        schema:
          type: string
      - description: Limiting and Pagination
        in: query
        name: limit
        schema:
          type: string
      - in: query
        name: embed
        schema:
          type: string
        description: Comma-separated list of related resources to embed in the response.
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/notification_response'
                type: array
          description: OK
        '206':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/notification_response'
                type: array
          description: Partial Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error_message'
                - $ref: '#/components/schemas/empty_object'
          description: Not Found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Not Acceptable
        '416':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Range Not Satisfiable
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Internal Server Error
      security:
      - bearerAuth:
        - read:data:notification
      - {}
    delete:
      parameters:
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: acknowledged
        schema:
          type: string
      - in: query
        name: event_id
        schema:
          type: string
      - in: query
        name: party_id
        schema:
          type: string
      - in: query
        name: recorded_by
        schema:
          type: string
      - in: query
        name: recorded_at
        schema:
          type: string
      - description: Preference
        in: header
        name: Prefer
        schema:
          enum:
          - return=representation
          - return=minimal
          - return=none
          type: string
      responses:
        '204':
          content: {}
          description: No Content
      tags:
      - Notification
      summary: Delete notification
      x-summary-source: derived
      operationId: deleteNotification
      x-operation-id-source: derived
    patch:
      parameters:
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: acknowledged
        schema:
          type: string
      - in: query
        name: event_id
        schema:
          type: string
      - in: query
        name: party_id
        schema:
          type: string
      - in: query
        name: recorded_by
        schema:
          type: string
      - in: query
        name: recorded_at
        schema:
          type: string
      - description: Preference
        in: header
        name: Prefer
        schema:
          enum:
          - return=representation
          - return=minimal
          - return=none
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notification'
          application/vnd.pgrst.object+json;nulls=stripped:
            schema:
              $ref: '#/components/schemas/notification'
          application/vnd.pgrst.object+json:
            schema:
              $ref: '#/components/schemas/notification'
          text/csv:
            schema:
              $ref: '#/components/schemas/notification'
        description: notification
        required: false
      responses:
        '204':
          content: {}
          description: No Content
      tags:
      - Notification
      x-codegen-request-body-name: notification
      summary: Update notification
      x-summary-source: derived
      operationId: patchNotification
      x-operation-id-source: derived
    post:
      parameters:
      - description: Filtering Columns
        in: query
        name: select
        schema:
          type: string
      - description: Preference
        in: header
        name: Prefer
        schema:
          enum:
          - return=representation
          - return=minimal
          - return=none
          - resolution=ignore-duplicates
          - resolution=merge-duplicates
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notification'
          application/vnd.pgrst.object+json;nulls=stripped:
            schema:
              $ref: '#/components/schemas/notification'
          application/vnd.pgrst.object+json:
            schema:
              $ref: '#/components/schemas/notification'
          text/csv:
            schema:
              $ref: '#/components/schemas/notification'
        description: notification
        required: false
      responses:
        '201':
          content: {}
          description: Created
      tags:
      - Notification
      x-codegen-request-body-name: notification
      summary: Create notification
      x-summary-source: derived
      operationId: postNotification
      x-operation-id-source: derived
    servers:
    - url: https://test.flex.internal:6443/api/v1
      description: Development
  /notification/{id}:
    summary: Notification - single
    description: ''
    parameters:
    - in: path
      name: id
      required: true
      schema:
        format: bigint
        type: integer
      example: 14
    get:
      operationId: read_notification
      summary: Read Notification
      tags:
      - Notification
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification_response'
          description: OK
          links:
            event_id:
              operationId: read_event
              parameters:
                path.id: $response.body#/event_id
              description: The `event_id` value returned in the response can be used as the `id` parameter in `GET /event/{id}`.
            party_id:
              operationId: read_party
              parameters:
                path.id: $response.body#/party_id
              description: The `party_id` value returned in the response can be used as the `id` parameter in `GET /party/{id}`.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error_message'
                - $ref: '#/components/schemas/empty_object'
          description: Not Found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Not Acceptable
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Internal Server Error
      security:
      - bearerAuth:
        - read:data:notification
      - {}
      parameters:
      - in: query
        name: embed
        schema:
          type: string
        description: Comma-separated list of related resources to embed in the response.
      - $ref: '#/components/parameters/ApiVersion'
    patch:
      operationId: update_notification
      summary: Update Notification
      tags:
      - Notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notification_update_request'
        description: notification
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification_response'
          description: OK
        '204':
          content: {}
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error_message'
                - $ref: '#/components/schemas/empty_object'
          description: Not Found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Not Acceptable
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
          description: Conflict
      security:
      - bearerAuth:
        - manage:data:notification
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
    servers:
    - url: https://test.flex.internal:6443/api/v1
      description: Development
components:
  schemas:
    notification_response:
      summary: Response - Notification
      description: Response schema - Notification about an event happening in the system.
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 89
        acknowledged:
          description: Whether the notification was acknowledged by the target user.
          format: boolean
          type: boolean
          example: false
        event_id:
          description: Reference to the event notified by this resource.
          format: bigint
          type: integer
          example: 37
        party_id:
          description: Reference to the party concerned by this notification.
          format: bigint
          type: integer
          example: 37
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        event:
          description: Embedded event
          oneOf:
          - $ref: '#/components/schemas/event_response'
          - type: 'null'
          nullable: true
        party:
          description: Embedded party
          oneOf:
          - $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - acknowledged
      - event_id
      - party_id
      - recorded_at
      - recorded_by
    party_response:
      summary: Response - Party
      description: 'Response schema - The body that interacts with the Flexibility Information System


        A party is the thing that is authorized to access or modify data in the Flexiblity Information System.


        Example party types:


        * Service Provider

        * System Operator

        * End User'
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 11
        business_id:
          description: The business identifier of the party. Format depends on `business_id_type`.
          format: text
          type: string
          example: '1337099000000'
        business_id_type:
          $ref: '#/components/schemas/party_business_id_type'
          default: uuid
        entity_id:
          description: Reference to the entity that is the parent of the party.
          format: bigint
          type: integer
          example: 30
        name:
          description: Name of the party. Maximum 128 characters.
          format: text
          type: string
          example: Flex Energy Supplier
        role:
          $ref: '#/components/schemas/party_role'
        type:
          $ref: '#/components/schemas/party_type'
        status:
          $ref: '#/components/schemas/party_status'
          default: new
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        entity:
          description: Embedded entity
          oneOf:
          - $ref: '#/components/schemas/entity_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - business_id
      - business_id_type
      - entity_id
      - name
      - role
      - type
      - status
      - recorded_at
      - recorded_by
    entity_client_response:
      summary: Response - Entity client
      description: Response schema - Client linked to an entity for client credentials and JWT grant authentication methods.
      type: object
      properties:
        id:
          description: Unique surrogate identifier.
          format: bigint
          type: integer
          readOnly: true
          example: 14
        entity_id:
          description: Reference to the entity that this client is attached to.
          format: bigint
          type: integer
          example: 30
        name:
          description: Name of the client.
          format: text
          type: string
          maxLength: 256
          nullable: true
          example: Laptop
        client_id:
          description: The identifier of the entity. For use with client credentials authentication method.
          format: text
          type: string
          readOnly: true
          example: addr@flex.test
        party_id:
          description: Reference to the party this client allows to assume. A null value means the client cannot assume any party.
          format: bigint
          type: integer
          nullable: true
          example: 30
        scopes:
          description: 'List of scopes granted to the user when it logs in as an entity or when it acts as the party. When assuming a party through party membership, the least privileged set of scopes will be kept.

            Scopes are inspired from OAuth 2.0 and allow refinement of access control and privilege delegation mechanisms.'
          type: array
          items:
            $ref: '#/components/schemas/auth_scope'
          nullable: false
          example:
          - read:data
        client_secret:
          description: The secret of the entity. For use with client credentials authentication method. Input as plain text but stored encrypted.
          format: text
          type: string
          minLength: 12
          nullable: true
          example: mysupersecretpassword
        public_key:
          description: The public key of the entity (X.509 SubjectPublicKeyInfo). For use with JWT grant authentication method.
          format: text
          type: string
          nullable: true
          pattern: ^-----BEGIN PUBLIC KEY-----\nMIIB[-A-Za-z0-9+/\n]*={0,3}\n-----END PUBLIC KEY-----$
          example: '-----BEGIN PUBLIC KEY-----

            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAq3DnhgYgLVJknvDA3clA

            TozPtjI7yauqD/ZuqgZn4KzzzkQ4BzJar4jRygpzbghlFn0Luk1mdVKzPUgYj0V

            kbRlHyYfxahbgOHixOOnXkKXrtZW7yWGjXPqy/ZJ/+kFBNPAzxy7fDuAzKfU3Rn5

            0sBakg95pua14W1oE4rtd4/U+sg2maCq6HgGdCLLxRWwXA8IBtvHZ48i6kxiz9tu

            -----END PUBLIC KEY-----'
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        entity:
          description: Embedded entity
          oneOf:
          - $ref: '#/components/schemas/entity_response'
          - type: 'null'
          nullable: true
        party:
          description: Embedded party
          oneOf:
          - $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - entity_id
      - client_id
      - scopes
      - recorded_at
      - recorded_by
    notification_update_request:
      summary: Update - Notification
      description: Request schema for update operations - Notification about an event happening in the system.
      type: object
      properties:
        acknowledged:
          description: Whether the notification was acknowledged by the target user.
          format: boolean
          type: boolean
          example: false
    event_data_updated_fields:
      type: object
      description: Common format of the data field in events concerning update operations.
      required:
      - kind
      - updated_fields
      properties:
        kind:
          description: Identifies the event data schema for discriminated union deserialization.
          type: string
          const: event.data.updated_fields
        updated_fields:
          description: Names of the fields that were modified by the update.
          type: array
          items:
            type: string
            format: text
          example:
          - status
      additionalProperties: false
    event_data_controllable_unit_lookup:
      type: object
      description: Format of the data field in a controllable_unit.lookup event.
      required:
      - kind
      - requesting_party_id
      properties:
        kind:
          description: Identifies the event data schema for discriminated union deserialization.
          type: string
          const: event.data.controllable_unit.lookup
        requesting_party_id:
          description: The party that performed the controllable unit lookup.
          type: integer
          format: bigint
          example: 42
      additionalProperties: false
    entity_response:
      summary: Response - Entity
      description: 'Response schema - Entity - Natural or legal person


        An entity is a natural or legal person that can be a party in the Flexibility Information System.


        Example entity types:


        * Person

        * Organisation'
      type: object
      properties:
        id:
          description: 'Unique surrogate identifier.


            Note:

            This is a Primary Key.'
          format: bigint
          type: integer
          readOnly: true
          example: 14
        business_id:
          description: The business identifier of the entity. Format depends on `business_id_type`.
          format: text
          type: string
          example: '13370000000'
        business_id_type:
          $ref: '#/components/schemas/entity_business_id_type'
        name:
          description: Name of the entity. Maximum 128 characters.
          format: text
          type: string
          example: John Smith
        type:
          $ref: '#/components/schemas/entity_type'
        recorded_at:
          description: When the resource was recorded (created or updated) in the system.
          format: date-time
          type: string
          readOnly: true
          example: '2023-12-31T23:59:00+00:00'
        recorded_by:
          description: The identity that recorded the resource.
          format: bigint
          type: integer
          readOnly: true
          example: 145
        client:
          description: Embedded entity_client
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/entity_client_response'
          - type: 'null'
          nullable: true
        party:
          description: Embedded party
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/party_response'
          - type: 'null'
          nullable: true
        party_membership:
          description: Embedded party_membership
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/party_membership_response'
          - type: 'null'
          nullable: true
        identity:
          description: Embedded identity
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/identity_response'
          - type: 'null'
          nullable: true
      required:
      - id
      - business_id
      - business_id_type
      - name
      - type
      - recorded_at
      - recorded_by
    error_message:
      description: Error message returned from the API.
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9]+$
          description: The error code.
          example: PT418
        details:
          type:
          - string
          - 'null'
          description: Detailed information about the error.
        hint:
          type:
          - string
          - 'null'
          description: A hint to help resolve the error.
        message:
          type: string
          description: The error message.
          example: error
      required:
      - code
      - message
    event_data:
      oneOf:
      - $ref: '#/components/schemas/event_data_updated_fields'
      - $ref: '#/components/schemas/event_data_controllable_unit_lookup'
      discriminator:
        propertyName: kind
        mapping:
          event.data.updated_fields: '#/components/schemas/event_data_updated_fields'
          event.data.controllable_unit.lookup: '#/components/schemas/event_data_controllable_unit_lookup'
    entity_business_id_type:
      description: The type of the business identifier.
      format: text
      type: string
      example: pid
      enum:
      - pid
      - org
      - email
    party_role:
      description: The role of the party. Currently maps to 1:1 to `type`. E.g. system_operator, service_provider.
      format: text
      type: string
      example: flex_energy_supplier
      enum:
      - flex_balance_responsible_party
      - flex_end_user
      - flex_energy_supplier
      - flex_flexibility_information_system_operator
      - flex_market_operator
      - flex_organisation
      - flex_service_provider
      - flex_system_operator
      - flex_third_party
    party_status:
      description: The status of the party.
      format: text
      type: string
      default: new
      enum:
      - new
      - active
      - inactive
      - suspended
      - terminated
      example: active
    auth_scope:
      description: Authorization scopes.
      format: text
      type: string
      enum:
      - manage:attachment
      - manage:attachment:service_providing_group_product_application_attachment
      - manage:auth
      - manage:data
      - manage:data:accounting_point_grid_location
      - manage:data:controllable_unit
      - manage:data:controllable_unit_service_provider
      - manage:data:controllable_unit_suspension
      - manage:data:controllable_unit_suspension_comment
      - manage:data:entity
      - manage:data:entity_client
      - manage:data:notification
      - manage:data:party
      - manage:data:party_membership
      - manage:data:service_provider_product_application
      - manage:data:service_provider_product_application_comment
      - manage:data:service_provider_product_suspension
      - manage:data:service_provider_product_suspension_comment
      - manage:data:service_providing_group
      - manage:data:service_providing_group_grid_prequalification
      - manage:data:service_providing_group_grid_prequalification_comment
      - manage:data:service_providing_group_grid_suspension
      - manage:data:service_providing_group_grid_suspension_comment
      - manage:data:service_providing_group_membership
      - manage:data:service_providing_group_product_application
      - manage:data:service_providing_group_product_application_comment
      - manage:data:service_providing_group_product_suspension
      - manage:data:service_providing_group_product_suspension_comment
      - manage:data:system_operator_product_type
      - manage:data:technical_resource
      - read:attachment
      - read:attachment:service_providing_group_product_application_attachment
      - read:attachment:service_providing_group_product_application_attachment_history
      - read:auth
      - read:data
      - read:data:accounting_point
      - read:data:accounting_point_balance_responsible_party
      - read:data:accounting_point_bidding_zone
      - read:data:accounting_point_end_user
      - read:data:accounting_point_energy_supplier
      - read:data:accounting_point_grid_location
      - read:data:accounting_point_grid_location_history
      - read:data:accounting_point_metering_grid_area
      - read:data:controllable_unit
      - read:data:controllable_unit_history
      - read:data:controllable_unit_service_provider
      - read:data:controllable_unit_service_provider_history
      - read:data:controllable_unit_summary
      - read:data:controllable_unit_suspension
      - read:data:controllable_unit_suspension_comment
      - read:data:controllable_unit_suspension_comment_history
      - read:data:controllable_unit_suspension_history
      - read:data:entity
      - read:data:entity_client
