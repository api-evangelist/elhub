openapi: 3.2.0
info:
  title: Access Work in Progress API
  version: 0.1.0
  description: 'The Authorization Grant Manager provides APIs for creating, managing, and retrieving authorization documents, authorization grants, and authorization requests used within Elhub''s access control ecosystem.

    Note: The authorization-grant APIs are under active development. Schemas and parameters may still change.'
  x-status: Development
  contact:
    name: team-devxp
  license:
    name: MIT
    url: https://github.com/elhub/auth-grant-manager?tab=MIT-1-ov-file
servers:
- url: https://api.elhub.no
  description: Production
- url: https://api-mt1.elhub.no
  description: MT1
security:
- bearerAuth: []
tags:
- name: Work in Progress
  description: Endpoints under development and not yet part of the stable API contract.
paths:
  /access/v1/authorization-documents:
    post:
      tags:
      - Work in Progress
      summary: '[WIP] Create an authorization document for signing'
      description: Create an authorization document for signing.
      operationId: createV1AuthorizationDocument
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
      - $ref: '#/components/parameters/UserAgent'
      - $ref: '#/components/parameters/AuthorizationMaskinporten'
      - $ref: '#/components/parameters/SenderGlnRequired'
      - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/V1AuthorizationDocumentSubmission'
            examples:
              changeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationSubmission'
              moveInAndChangeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationSubmission'
      responses:
        '201':
          description: The authorization document was created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationDocumentResource'
              examples:
                changeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationSubmissionResponse'
                moveInAndChangeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationSubmissionResponse'
  /access/v1/authorization-documents/{id}:
    get:
      tags:
      - Work in Progress
      summary: '[WIP] Get an authorization document by ID'
      description: Get an authorization document by ID.
      operationId: getV1AuthorizationDocument
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
      - $ref: '#/components/parameters/UserAgent'
      - $ref: '#/components/parameters/AuthorizationMaskinporten'
      - $ref: '#/components/parameters/SenderGlnRequired'
      - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      - name: id
        in: path
        required: true
        description: Unique identifier of the authorization document to retrieve.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The requested authorization document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationDocumentResource'
              examples:
                changeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationGetResponse'
                moveInAndChangeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationGetResponse'
  /access/v1/authorization-grants/{id}:
    get:
      tags:
      - Work in Progress
      summary: '[WIP] Get an authorization grant by ID'
      description: Get an authorization grant and its permissions.
      operationId: getV1AuthorizationGrant
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
      - $ref: '#/components/parameters/UserAgent'
      - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUserOptional'
      - $ref: '#/components/parameters/SenderGlnOptional'
      - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      - name: id
        in: path
        required: true
        description: Unique identifier of the authorization grant to retrieve.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The requested authorization grant.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationGrantResource'
              examples:
                changeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationGrantResponse'
                moveInAndChangeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationGrantResponse'
  /access/v1/authorization-requests:
    post:
      tags:
      - Work in Progress
      summary: '[WIP] Create an authorization request for approval'
      description: Create an authorization request for approval.
      operationId: createV1AuthorizationRequest
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
      - $ref: '#/components/parameters/UserAgent'
      - $ref: '#/components/parameters/AuthorizationMaskinporten'
      - $ref: '#/components/parameters/SenderGlnRequired'
      - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/V1AuthorizationRequestSubmission'
            examples:
              changeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationRequestSubmission'
              moveInAndChangeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationRequestSubmission'
      responses:
        '201':
          description: A Pending authorization request.
          headers:
            Location:
              description: URI of the created authorization request, also returned as links.self.
              schema:
                type: string
                format: uri-reference
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationRequestResource'
              examples:
                pending:
                  $ref: '#/components/examples/V1AuthorizationRequestPendingResponse'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaTypeError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /access/v1/authorization-requests/{id}:
    get:
      tags:
      - Work in Progress
      summary: '[WIP] Get an authorization request by ID'
      description: Get an authorization request by ID.
      operationId: getV1AuthorizationRequest
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
      - $ref: '#/components/parameters/UserAgent'
      - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUser'
      - $ref: '#/components/parameters/SenderGlnOptional'
      - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      - name: id
        in: path
        required: true
        description: Unique identifier of the authorization request to retrieve.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The authorization request, including its current approval outcome.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationRequestResource'
              examples:
                pending:
                  $ref: '#/components/examples/V1AuthorizationRequestPendingResponse'
                accepted:
                  $ref: '#/components/examples/V1AuthorizationRequestAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
