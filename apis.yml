aid: elhub
name: Elhub
description: Elhub is Norway's national IT platform (datahub) for collecting and distributing electricity data, owned and operated by Elhub AS,
  a public company owned by Statnett SF. Grid companies, electricity suppliers and service providers use Elhub to exchange metering values and
  customer information for more than 4 million metering points, and it handles supplier switching and settlement processes. Households and businesses
  use Elhub Min side to view and share their own electricity data. The Elhub API Portal (api.elhub.no) offers public open-data APIs (Energy Data
  API, CC BY 4.0) and Maskinporten-protected APIs including Data Export, Market Data, Access, Settlement and Metering Values APIs.
