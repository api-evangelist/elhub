name: Elhub OAuth Scopes
description: The OpenAPI contracts declare only http bearer schemes, so derive-oauth-scopes.py found nothing; the scopes come from the docs. API Portal protected APIs use Maskinporten (Digdir OAuth2 JWT-bearer)
  tokens carrying Elhub scopes defined per Elhub party type; Elhub assigns the scope after contact at post@elhub.no. The Flexibility Information System (FIS) publishes its own hierarchical scope list (manage/read/use
  by API and resource).
note: Scope per restricted Energy Data dataset is tabulated on https://api.elhub.no/restricted-endpoints/scopes (e.g. METERING_VALUES_HOUR_RESTRICTED -> elhub:enduser, elhub:thirdparty).
scope_count: 117
